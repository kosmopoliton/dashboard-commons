text = "Windows-Eigenes, das unter macOS entfällt oder schon richtig läuft. Steht hier, damit die Liste vollständig ist."

[[block]]
titel = "DB02: Transport zum Boten: benannte Pipe mit DACL, Prüfung des Gegenübers, Impersonation"
punkte = [
  "Ort: src/bote/win.rs:1-649 (ganze Datei: CreateNamedPipeW mit FILE_FLAG_FIRST_PIPE_INSTANCE und PIPE_REJECT_REMOTE_CLIENTS, CreateFileW mit SECURITY_IDENTIFICATION, PeekNamedPipe, CancelIoEx, SDDL, GetSecurityInfo, SetEntriesInAclW, Token- und Prozessabfragen, ImpersonateNamedPipeClient); src/bote/server.rs:1-210 (ganze Datei, Exit-Code 4 Pipe belegt); src/bote/mod.rs:1-29, :36-40 (server und win nur unter Windows), :87-122 (DIENST_MASKE, DIENST_RECHTE, sddl); src/bote/client.rs:1-30, :242-283 (Ziel, Verbindung, Wache), :343-349, :432-464, :510-554 (verbinden mit den zwei Prüfwegen), :562-577; src/bin/dashboard-bote.rs:231-250; src/dienst/einstellungen.rs:111-117, :186-188, :295-298 (Name der Pipe ohne Schrägstriche).",
  "Was an Windows hängt: Der Bote ist Server einer lokalen benannten Pipe; die DACL gibt dem Dienstkonto nur Lesen und Schreiben; der Dienst prüft Besitzer der Pipe, Programm und Konto des Serverprozesses; der Bote liest das Konto des Clients per Impersonation.",
  "Heute außerhalb von Windows: win und server werden nicht übersetzt (bote/mod.rs:36-40). Der Client liefert den Fehler Den Boten gibt es nur unter Windows (client.rs:556-559, :579-583); Wache.abbrechen tut nichts (:274-282). Das Programm dashboard-bote meldet im Boten-Modus denselben Satz und endet mit 2 (bin/dashboard-bote.rs:252-256).",
  "Schwere: Kein Handlungsbedarf sofern S01 angenommen wird",
  "Vorschlag für macOS: entfällt unter macOS, weil das gelöste Problem dort nicht besteht: Es gibt kein getrenntes Dienstkonto, der Server läuft als Inhaber und führt die Aufgaben im eigenen Prozess aus (DB01). Nur falls die Maintainer auf zwei Prozessen bestehen (etwa Server als LaunchDaemon unter eigenem Konto), wäre der Ersatz: Unix-Socket in einem Ordner mit Modus 0700 des Inhabers, Datei 0600 oder 0660 mit Gruppe des Dienstkontos; Prüfung des Gegenübers mit getpeereid oder LOCAL_PEERCRED für die Benutzernummer und LOCAL_PEERPID mit proc_pidpath für das Programm; Zeitlimits über SO_RCVTIMEO statt PeekNamedPipe. Das wäre Aufwand gross und bräuchte einen trait über win.rs (Rohr, Zeilen, pipe_oeffnen, pipe_besitzer, server_pid, prozess_programm, prozess_sid, client_sid); ich rate davon ab.",
  "Folge für Windows: nichts, wenn es entfällt.",
  "Prüfung: Vorhandene Windows-Tests in server.rs:212-400 und tests/bote_pipe.rs bleiben unverändert. Für macOS nichts zu prüfen außer, dass der Boten-Modus des Programms weiter sauber mit einem Satz endet.",
  "Aufwand: klein (entfällt); gross nur in der abgelehnten Variante.",
]

[[block]]
titel = "DB11: Wächter des Boten: Neustart-Schleife, Job-Objekt, verwaiste Boten beenden"
punkte = [
  "Ort: src/bote/waechter.rs:1-158 (Schleife, Exit-Codes 0, 2, 4), :160-297 (Modul job: CreateJobObjectW, IsProcessInJob, AssignProcessToJobObject, OpenProcess, TerminateProcess, WaitForSingleObject; Vergleich von Programmpfad und SID über bote::win), :299-312 (Rückfall); src/bin/dashboard-bote.rs:23-28, :258-271.",
  "Was an Windows hängt: Die Aufgabenplanung startet den Wächter bei der Anmeldung; er hält den Boten am Leben und räumt verwaiste Boten weg.",
  "Heute außerhalb von Windows: Die Schleife wird übersetzt. Das Modul job ist ein Stub: kein Job, zuweisen tut nichts, verwaiste_beenden liefert 0 (waechter.rs:299-312). In der Praxis endet der Wächter sofort mit 2, weil der Bote als Kind mit 2 endet.",
  "Schwere: Kein Handlungsbedarf sofern S01 angenommen wird",
  "Vorschlag für macOS: entfällt unter macOS, weil launchd den Server mit KeepAlive selbst neu startet und es keinen zweiten Prozess gibt. Die Staffelung der Neustarts (5 s, 30 s, 2 min) hat in launchd nur ein grobes Gegenstück (ThrottleInterval, Standard 10 s); in der Studie als Unterschied nennen.",
  "Folge für Windows: nichts.",
  "Prüfung: Vorhandene Tests waechter.rs:314-352 laufen überall (reine Rechnung der Pausen).",
  "Aufwand: klein.",
]

[[block]]
titel = "DB07: Port exklusiv binden (SO_EXCLUSIVEADDRUSE) und WinSock-Fehlernummern"
punkte = [
  "Ort: src/dienst/mod.rs:241-247 (Begründung localhost zuerst ::1), :259-280 (binden), :282-288 (kein_ipv6 mit WSAEAFNOSUPPORT 10047 und WSAEPFNOSUPPORT 10046 unter cfg!(windows)), :290-300 (lauscher_oeffnen), :302-313 (exklusiv mit setsockopt), :315-319 (Rückfall); Cargo.toml Feature Win32_Networking_WinSock.",
  "Was an Windows hängt: Unter Windows könnte ein fremdes Programm mit SO_REUSEADDR dieselbe Adresse übernehmen; SO_EXCLUSIVEADDRUSE verhindert das.",
  "Heute außerhalb von Windows: exklusiv tut nichts und meldet Erfolg (mod.rs:316-319). Zwei Lauscher auf derselben Adresse und demselben Port scheitern unter macOS ohnehin mit Adresse belegt, solange niemand SO_REUSEPORT setzt. Die WinSock-Nummern werden außerhalb von Windows nicht geprüft.",
  "Vorschlag für macOS: entfällt unter macOS, weil SO_REUSEADDR dort kein Übernehmen einer lauschenden Adresse erlaubt. Zwei Randpunkte für die Studie: (1) Fehlt IPv6 ganz, liefert macOS beim Anlegen des Sockets EAFNOSUPPORT; ob Rust das auf AddrNotAvailable oder Unsupported abbildet, konnte ich durch Lesen nicht klären; falls nicht, wäre es Startfehler 9 statt Warnung. Ein cfg(unix)-Zusatz in kein_ipv6 mit den libc-Nummern wäre die Absicherung. (2) Siehe Unsicher 3 zum sofortigen Neustart.",
  "Folge für Windows: nichts.",
  "Prüfung: Vorhanden und überall lauffähig: belegter_port_wird_erkannt, beide_loopback_adressen_und_nur_ipv6_belegt_ist_startfehler, kein_ipv6_wird_erkannt (dienst/mod.rs:824-857); exklusiv_gebunden nur Windows (:838-846).",
  "Aufwand: klein.",
]

[[block]]
titel = "DB17: Programme ohne Konsole: windows_subsystem und AttachConsole"
punkte = [
  "Ort: src/bin/dashboard-bote.rs:1-13 (Attribut windows_subsystem), :83-126 (konsole mit AttachConsole, GetStdHandle, SetStdHandle, CONOUT$), :128-131 (Rückfall), :133-153 (zeigen mit Ersatzdatei in TEMP); src/bin/dashboard-herzschlag.rs:1-8.",
  "Was an Windows hängt: Beide Programme gehören zum Subsystem windows, damit kein Konsolenfenster aufgeht; Ausgaben hängen sich an die Konsole des Aufrufers.",
  "Heute außerhalb von Windows: Das Attribut wird vom Compiler außerhalb von Windows ignoriert. konsole liefert immer true (bin/dashboard-bote.rs:128-131), Ausgaben gehen normal auf stdout und stderr. Beide Programme verhalten sich richtig.",
  "Vorschlag für macOS: entfällt unter macOS, weil es dort keine Trennung von Konsolen- und Fensterprogrammen gibt. Das Programm dashboard-herzschlag ist unter macOS gleichbedeutend mit dashboard herzschlag; es kann weiter mitgebaut werden.",
  "Folge für Windows: nichts.",
  "Prüfung: cargo check --target aarch64-apple-darwin; tests/herzschlag.rs (andere Scheibe).",
  "Aufwand: klein (nichts zu tun).",
]

[[block]]
titel = "DB19: Pfadvergleich: Rückstrich als Trenner, Kleinschreibung, Vorsatz \\\\?\\"
punkte = [
  "Ort: src/bote/mod.rs:124-137 (pfad_zum_vergleich, gleicher_pfad), Test :180-187; Verwendung src/bote/aufgaben.rs:110-129, :134-156, :176, :274-287 (wurzel_pruefen hängt einen Rückstrich an), src/bote/client.rs:546; eigener Vergleich im Wächter src/bote/waechter.rs:233-239 (nur Windows).",
  "Was an Windows hängt: Pfade werden zum Vergleichen kanonisch gemacht, Schrägstriche in Rückstriche gewandelt, der Vorsatz für lange Pfade entfernt und alles klein geschrieben.",
  "Heute außerhalb von Windows: Läuft und liefert auf einem üblichen macOS-Datenträger (Groß/Klein egal) richtige Ergebnisse; die Rückstriche sind nur innere Vergleichsform und auf beiden Seiten gleich. Ränder: Auf einem Datenträger mit Unterscheidung von Groß und Klein gelten zwei verschiedene Ordner als gleich; ein Rückstrich ist unter macOS ein erlaubtes Zeichen im Namen und wird wie ein Trenner behandelt; canonicalize löst Symlinks auf (/tmp wird /private/tmp), das ist auf beiden Seiten gleich.",
  "Vorschlag für macOS: So lassen und in der Studie als bekannte Vereinfachung nennen. Wer härten will: unter cfg(unix) ohne Ersetzen der Trenner und Vergleich über die aufgelösten Pfade Bestandteil für Bestandteil, wie es src/inhalt/seite.rs:146-150 schon tut (andere Scheibe); dann gäbe es nur noch eine Vergleichsfunktion im Programm.",
  "Folge für Windows: nichts, oder bei Zusammenlegen eine Funktion weniger.",
  "Prüfung: Vorhanden: pfade_vergleichen (bote/mod.rs:180-187) und git_nur_fuer_repos_der_projektseiten (aufgaben.rs:419-447) laufen nach meiner Lesart auch unter macOS grün.",
  "Aufwand: klein.",
]

[[block]]
titel = "PC-E1: Cargo.toml, .cargo/config.toml, rustfmt.toml, Cargo.lock"
punkte = [
  "Ort: Cargo.toml:39-44 (sysinfo ~0.33 und chrono =0.4.38, beide wegen der GNU-Toolchain ohne MinGW unter Windows), 57-71, 73-91 (target.cfg(windows): winreg 0.56, windows-service =0.8.1, windows-sys =0.61.2); .cargo/config.toml:1-20 (nur [target.x86_64-pc-windows-gnu] rustflags dlltool=llvm-dlltool.exe); rustfmt.toml:1-2; crates/dashboard-projekt/Cargo.toml, projects/_vorlage/server/Cargo.toml, vorlagen/dashboard-lokal/Cargo.toml",
  "Was an Windows hängt: Die Windows-Abhängigkeiten stehen sauber unter cfg(windows); die rustflags gelten nur für das Windows-GNU-Ziel und wirken unter macOS nicht.",
  "Heute außerhalb von Windows: Aus den Manifesten spricht nichts gegen einen Bau für aarch64-apple-darwin. Cargo.lock: das einzige Paket mit C-Compiler ist cc, und nur iana-time-zone-haiku hängt daran (nur für Haiku, wird unter macOS nicht gebaut). Kein openssl, ring, aws-lc, libz, bindgen, cmake. sysinfo 0.33.1 und iana-time-zone nutzen core-foundation-sys und binden System-Frameworks (CoreFoundation, IOKit); dafür reicht der Linker der Xcode Command Line Tools, den Rust unter macOS ohnehin braucht. redb, getrandom, mio, socket2 nur libc. Die Pins sysinfo ~0.33 und chrono =0.4.38 schaden unter macOS nicht (ältere, aber lauffähige Fassungen).",
  "Vorschlag für macOS: nichts ändern. Die Pins nicht für macOS lockern (eine Cargo.lock für beide). Wenn PC-B3 host_statistics64 nutzt, libc als direkte Abhängigkeit unter cfg(target_os = macos) aufnehmen (steht schon in Cargo.lock).",
  "Folge für Windows: nichts.",
  "Prüfung: cargo check --target aarch64-apple-darwin --workspace --all-targets unter Windows (rustup target add; check braucht keinen macOS-Linker, Bauskripte laufen auf dem Wirt). Danach cargo clippy mit -D warnings für das Ziel, weil scripts/Freigeben.ps1:201 und scripts/hooks/pre-commit:29 Warnungen als Fehler werten.",
  "Aufwand: klein.",
]

[[block]]
titel = "PC-E2: Zusammenbau-Wächter, dlltool-Regel und cargo-Einstellungen"
punkte = [
  "Ort: src/projekte/zusammenbau.rs:24-29 (Kopf), 393-437 (DlltoolOrte, erlaubt), 440-492 (konfig_pruefen_mit, Zeile 465-485), 508-539; Vorlage vorlagen/dashboard-lokal/Cargo.toml:4-18, kisten.toml:9",
  "Was an Windows hängt: In cargo-Einstellungen über dem Inhalt ist nur dlltool als rustflags erlaubt (llvm-dlltool.exe, der Name allein oder ein Pfad in der aktiven Toolchain oder in CARGO_HOME/bin).",
  "Heute außerhalb von Windows: Die Regel läuft, ist aber gegenstandslos (kein dlltool unter macOS). Eine cargo-Einstellung über dem Inhalt mit macOS-üblichen Einträgen (etwa [target.aarch64-apple-darwin] linker) wird als nicht erlaubt gemeldet; das ist die gewollte Strenge. Der Aufruf cargo --config <code-repo>/.cargo/config.toml (fremde Scheibe bote/bau) bleibt harmlos.",
  "Vorschlag für macOS: entfällt unter macOS, weil es kein dlltool braucht; nur der Satz in Zeile 480 sollte unter macOS dlltool nicht als Erlaubtes nennen (PC-C5). PC-A4 ist die eigentliche Arbeit an dieser Datei.",
  "Folge für Windows: nichts.",
  "Prüfung: bestehende Tests zu konfig_pruefen_mit sind rein.",
  "Aufwand: klein.",
]

[[block]]
titel = "PC-E3: Zusammenbau-Wächter vertraut der Git-Einstellung der Ebene system"
punkte = [
  "Ort: src/projekte/zusammenbau.rs:683-692 (Kommentar 686: Program Files, nur Administratoren), 655-681",
  "Was an Windows hängt: Git-Einstellungen der Ebene system gelten als sicher, weil sie unter Windows in Program Files liegen und nur Administratoren sie ändern können.",
  "Heute außerhalb von Windows: Mit /usr/bin/git (Apple) liegt die System-Einstellung unter /Library/Developer/CommandLineTools bzw. in Xcode und gehört root; die Annahme hält.",
  "Schwere: Kein Handlungsbedarf (mit Auflage)",
  "Vorschlag für macOS: Auflage für B2: Ein Homebrew-git (/opt/homebrew/bin/git) liest /opt/homebrew/etc/gitconfig, und das ist ohne Administrator beschreibbar. Der Wächter muss bei /usr/bin/git bleiben, oder die Ebene system unter macOS wie global prüfen.",
  "Folge für Windows: nichts.",
  "Prüfung: git_einstellung_rot ist rein (689-703), Einheitstest mit Plattform als Parameter.",
  "Aufwand: klein.",
]

