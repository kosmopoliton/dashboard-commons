[[block]]
titel = "Funktion fehlt (24)"
text = "Ein Teil fehlt unter macOS, der Rest läuft."

[[block]]
titel = "DB01: Mit Einstellungsdatei ist der Bote Pflicht; kein Weg im eigenen Prozess"
punkte = [
  "Ort: src/app.rs:95-103 (Felder einstellungen und bote), :230 (Bote entsteht immer, wenn Einstellungen da sind), :233-251 (Sammler über den Boten statt lokal), :278-290 (Git-Stand über den Boten), :307 (Beobachter bekommt den Boten), :382-384 (Bote-Wache), :391-408 (Baumeister: direkt nur ohne Boten); src/bote/sammler.rs:1-211 (ganze Datei); src/bote/client.rs:230-247 und :285-294 (Typ Bote und Bote::neu); Aufrufer außerhalb der Scheibe: src/baumeister.rs:181-196, src/git_zwischenspeicher.rs:231-232 und :453, src/api/schluessel.rs:27, :134, :232, src/api/oeffnen.rs:103, src/api/pc.rs:98, src/meldungen.rs:759, src/api/events.rs:746.",
  "Was an Windows hängt: Das Konzept Dienstkonto sieht das Profil des Inhabers nicht, also holt ein Helfer unter dem Konto des Inhabers. Sobald eine dienst.toml geladen ist, gehen Benutzer-Daten der PC-Seite, Ordnergrößen, Git-Stand, Tresor, Bau und Öffnen ausschließlich über den Boten-Client.",
  "Heute außerhalb von Windows: Der Client wird angelegt; jede Anfrage endet mit Den Boten gibt es nur unter Windows (client.rs:556-559). Die Sammler tragen den Fehlersatz ein und versuchen es alle fünf Minuten neu (sammler.rs:21-22, :151-153, :197-205); Ordnergrößen werden nie gezählt; der Bau antwortet Der Bote ist nicht erreichbar (baumeister.rs:192); Git-Stand über den Boten fällt aus. Der Server selbst läuft und liefert Seiten aus.",
  "Vorschlag für macOS: Kein eigener Bote-Prozess. Unter macOS läuft der Server als angemeldeter Benutzer (LaunchAgent), er sieht Profil, Schlüsselbund, PATH und Repos selbst. Der Typ bote::client::Bote bekommt eine zweite Ausführung im eigenen Prozess: anfragen ruft bote::aufgaben::ausfuehren_von mit einem Kontext aus Kontext::jetzt().mit_einstellungen(e) (aufgaben.rs:56-91, :297-306). Diese Funktion ist schon plattformneutral und wird von --einmal genau so benutzt (bin/dashboard-bote.rs:175-204). Alle Aufrufer bleiben, wie sie sind, weil sie nur Anfrage und Antwort sprechen; der Stand ist dann immer verbunden. Damit entfallen unter macOS Pipe, Prüfung des Gegenübers, Wächter und Aufgabenplanung (DB02, DB11). Auswahl rein über die Plattform (cfg), kein neuer Schlüssel in dienst.toml, weil die Datei unbekannte Felder ablehnt (deny_unknown_fields, einstellungen.rs:130) und ältere Programme sonst scheitern. Für Öffnen braucht der Weg im eigenen Prozess eine eigene Kennung des Aufrufers anstelle der SID des Dienstkontos (DB03, DB12).",
  "Folge für Windows: Verhalten gleich, aber geteilter Code wird umgebaut: Bote in client.rs wird zu zwei Ausführungen (Pipe, ImProzess), entweder als enum oder als trait; Ziel und Verbindung bleiben der Windows-Ausführung. Das ist die größte ehrliche Änderung an gemeinsamem Code in dieser Scheibe. Der Weg im eigenen Prozess wird unter Windows mit übersetzt (für Tests), aber nie gewählt.",
  "Prüfung: Vorhanden: Tests von aufgaben.rs:397-537 prüfen die Aufgaben ohne Pipe; sammler.rs:213-254 prüft das Verhalten bei fehlendem Boten. Neu: Tests Bote im eigenen Prozess beantwortet Hallo, RepoStempel, Inventar; Sammler mit diesem Boten füllt den Stand. Ohne Mac prüfbar, weil die neue Ausführung plattformneutral ist und die Tests unter Windows laufen; dazu cargo check --target aarch64-apple-darwin und ein macOS-Runner für den ganzen Lauf.",
  "Aufwand: mittel, wegen des Umbaus in client.rs und der Kennung des Aufrufers.",
]

[[block]]
titel = "DB08: Externe Programme nur von festen Windows-Orten (git, node, npm, cargo, PowerShell, winget, explorer)"
punkte = [
  "Ort: src/dienst/programme.rs:1-11 (Begründung), :16-54 (Werkzeug), :56-91 (Orte aus SystemRoot, ProgramFiles, LOCALAPPDATA, USERPROFILE; Rückfall C:\\Windows und C:\\Program Files; GIT_RUECKFALL :73), :93-124 (kandidaten mit .exe-Namen), :132-140 (AppExecLink in WindowsApps), :142-154 (Registry HKLM\\SOFTWARE\\GitForWindows über winreg), :156-167, :251-270 (npm über node.exe und node_modules\\npm\\bin\\npm-cli.js daneben).",
  "Was an Windows hängt: Windows sucht Programme ohne Pfad zuerst im Ordner des Aufrufers; darum startet das Dashboard nur mit vollem Pfad aus einer festen Liste. Die Liste, die Umgebungsvariablen, die Registry und die Lage von npm-cli.js sind Windows-Form.",
  "Heute außerhalb von Windows: kandidaten liefert nur für Git den einen Ort /usr/bin/git, für alle anderen Werkzeuge eine leere Liste (programme.rs:95-100); git_aus_registry liefert None (:151-154). Folge: Node nicht gefunden, also kein npm, kein Bau, keine Projektprüfung mit Node; cargo und rustc nicht gefunden (Werkzeug-Versionen); PowerShell, cmd, winget, Explorer nicht gefunden. /usr/bin/git ist unter macOS nur der Platzhalter der Xcode-Kommandozeilenwerkzeuge: ohne deren Installation öffnet der Aufruf einen Installationsdialog oder scheitert.",
  "Vorschlag für macOS: Das Prinzip feste Orte behalten (ein LaunchAgent erbt nur den PATH /usr/bin:/bin:/usr/sbin:/sbin, Homebrew wäre über PATH ohnehin nicht zu finden), aber mit einer macOS-Liste: Git: /usr/bin/git, /opt/homebrew/bin/git, /usr/local/bin/git. Node: /opt/homebrew/bin/node, /usr/local/bin/node. Cargo und Rustc: HOME/.cargo/bin. npm-cli.js: zusätzlich zu daneben der Ort <Ordner von node>/../lib/node_modules/npm/bin/npm-cli.js (so legen Homebrew und der Node-Installer es ab), berechnet aus dem nicht aufgelösten Pfad, weil bin/node bei Homebrew ein Symlink in Cellar ist. PowerShell, cmd, winget, Explorer bleiben unter macOS leer (ihre Aufrufer sind Windows-Sammler, andere Scheibe, und Öffnen, DB12). Der Grund für die Regel (Suche im Programmordner) besteht unter macOS nicht; die Liste dient dort der Verlässlichkeit, nicht der Abwehr. Offene Frage an die Maintainer: Versionsverwalter im Profil (nvm, fnm, volta) sind damit nicht abgedeckt; Vorschlag dafür eine freiwillige Umgebungsvariable wie DASHBOARD_NODE mit absolutem Pfad.",
  "Folge für Windows: nichts am Verhalten. Der vorhandene Zweig cfg!(not(windows)) in kandidaten wird erweitert; npm_cli bekommt einen zweiten Kandidaten (unter Windows bleibt der erste Treffer derselbe).",
  "Prüfung: Vorhanden: programme.rs:281-482, davon die Tests mit nachgebauten Orten nur unter Windows (:320-380). Neu und ohne Mac prüfbar: die Liste als reine Funktion kandidaten_fuer(plattform, orte, werkzeug) führen, damit ein Windows-Rechner die macOS-Tabelle mit einem Temp-Ordner testet (wie der vorhandene Test vorhandene_programme_an_festen_orten). Der Test kein_command_ausserhalb (:448-481) läuft überall und sichert, dass kein Aufruf an der Liste vorbeigeht. Der vorhandene Test npm_liegt_neben_node (:434-446) scheitert heute unter macOS (DB20) und muss den Pfad aus Teilen bauen.",
  "Aufwand: mittel, wegen der Lage von npm und der Frage der Versionsverwalter.",
]

[[block]]
titel = "DB04: Git nur in Ordnern, die dem eigenen Konto gehören (Besitzer über SID)"
punkte = [
  "Ort: src/bote/aufgaben.rs:195-225 (besitzer_pruefen), :227-262 (ordner_besitzer mit GetNamedSecurityInfoW und ConvertSidToStringSidW), Aufruf :370-372.",
  "Was an Windows hängt: Vor git wird der Besitzer des Repo-Ordners (SID) mit der SID des Boten verglichen.",
  "Heute außerhalb von Windows: Der Zweig cfg(not(windows)) setzt den Besitzer fest auf den Fehler nur unter Windows (aufgaben.rs:212-213). Für jeden vorhandenen Ordner antwortet die Aufgabe darum mit Das Repo gehört nicht diesem Konto (:220-223). Scheitert geschlossen, aber der Git-Stand über die Aufgaben des Boten ist damit für alle Repos aus. Der direkte Weg im Modus Umgebung kennt diese Prüfung nicht und geht.",
  "Vorschlag für macOS: cfg(unix)-Zweig: Besitzer aus std::fs::metadata und std::os::unix::fs::MetadataExt::uid, Vergleich mit der eigenen Benutzernummer (getuid über libc). Kennung als Text uid:<nummer> (DB03). Git selbst prüft unter Unix den Besitzer zusätzlich (safe.directory).",
  "Folge für Windows: nichts, nur neuer cfg-Zweig.",
  "Prüfung: Vorhanden: git_nur_in_eigenen_ordnern (aufgaben.rs:482-499), nur Windows. Neu: derselbe Test für cfg(unix) mit eigenem Temp-Ordner (ja) und / (gehört root, nein). Ohne Mac auf Linux ausführbar; der Vergleich selbst ist eine reine Funktion.",
  "Aufwand: klein.",
]

[[block]]
titel = "DB03: Konten als SID (Inhaber, Dienstkonto, Client an der Pipe)"
punkte = [
  "Ort: src/dienst/einstellungen.rs:98-109 (Konten), :119-125 (ist_sid), :279-294 (Prüfung), :312-322 (kurz); src/bote/aufgaben.rs:24-25, :47-48, :54-60 (konto_sid), :88; src/bote/oeffnen.rs:263-270 (vom_dienst), :274-278; src/bote/client.rs:246, :288, :534-552; src/bote/server.rs:64-80 (nur Windows); src/dienst/mod.rs:439-440 und :546-547 (dienst_einrichten aus der SID, Ziel in src/oeffnen/mod.rs, andere Scheibe).",
  "Was an Windows hängt: Identität ist überall eine Windows-SID als Text (S-1-5-21 für den Inhaber, S-1-5-80 für NT SERVICE\\Dashboard). Die Einstellungsdatei nimmt nur leere Werte oder die Form einer SID an.",
  "Heute außerhalb von Windows: konto_sid ist der leere Text (aufgaben.rs:59-60). ist_inhaber lehnt leere Werte ab (src/anmeldung/mod.rs:94-97), also schlagen vom_dienst und jeder Besitzervergleich fehl. In dienst.toml müssen die Felder leer bleiben; eine Benutzernummer wäre keine SID und würde abgelehnt.",
  "Vorschlag für macOS: Unter macOS gibt es nur ein Konto (der Server läuft als Inhaber). Kennung des Kontos im Kontext: uid:<nummer> aus getuid. [konten] bleibt in einer macOS-dienst.toml leer (ist heute schon erlaubt), keine Formänderung der Datei. Der Client im eigenen Prozess (DB01) übergibt als Aufrufer dieselbe Kennung, und der Kontext trägt sie als erlaubten Aufrufer für Öffnen; damit bleibt die Regel Öffnen nur vom Server bestehen, ohne SID. Das Feld konto_sid sollte dabei in konto umbenannt werden, muss aber nicht.",
  "Folge für Windows: nichts, wenn nur der Wert im cfg-Zweig anders gefüllt wird; die Umbenennung wäre eine rein mechanische Änderung im geteilten Code und im Vertrag (Antwort Hallo trägt konto_sid, src/vertrag/bote, andere Scheibe; dort den Namen besser lassen).",
  "Prüfung: Vorhanden: sid_form_streng und sids_lesen_und_pruefen (einstellungen.rs:436-479), nur_vom_dienst (oeffnen.rs:516-530). Neu: Test Kennung des eigenen Kontos ist nicht leer auf jeder Plattform; Test Öffnen im eigenen Prozess mit passender und mit fremder Kennung. Ohne Mac: reine Vergleichsfunktionen, laufen unter Windows; cfg(unix)-Zweig auf Linux.",
  "Aufwand: klein.",
]

[[block]]
titel = "DB12: Öffnen von Dateien und Ordnern (ShellExecuteW, AssocQueryStringW, explorer.exe, Programmliste mit .exe)"
punkte = [
  "Ort: src/bote/oeffnen.rs:1-19 (Beschreibung), :35-67 (Positivliste der Programme als .exe-Namen), :69-78 (trait Oeffner), :80-94 (ShellAufruf), :96-108 (explorer_argument mit Rückstrich-Punkt), :110-123 (explorer_befehl, raw_arg), :125-186 (WindowsOeffner), :205-244 (Aufnahme für Tests ruft explorer_befehl), :296-321 (Satz Windows hat den Ort nicht geöffnet :318); src/bote/aufgaben.rs:94-100 (standard_oeffner), :387-393; src/dienst/programme.rs:35, :51, :121 (Werkzeug Explorer).",
  "Was an Windows hängt: Dateien öffnet ShellExecuteW mit dem Verb open, aber nur, wenn das der Endung zugeordnete Programm (AssocQueryStringW) auf einer Liste von Windows-Programmen steht. Ordner und zip gehen über explorer.exe aus SystemRoot mit einem besonders geformten Argument.",
  "Heute außerhalb von Windows: datei liefert den Fehler nur unter Windows (oeffnen.rs:148-151); programm_fuer liefert None (:182-185), damit wird jede Datei schon vorher mit dem Satz zum verknüpften Programm abgewiesen (:301-307); ordner scheitert in explorer_befehl mit explorer.exe nicht gefunden (programme.rs:95-100). Davor scheitert es schon an der Kennung des Aufrufers (DB03), und ohne Boten gibt es den Weg gar nicht (src/api/oeffnen.rs:103).",
  "Vorschlag für macOS: Den vorhandenen trait Oeffner um eine Ausführung MacOeffner ergänzen und in standard_oeffner je Plattform wählen. Datei: /usr/bin/open mit fester Programmangabe statt Abfrage der Zuordnung, also open -b <Bundle-Kennung> <Pfad> mit einer macOS-Positivliste je Endung (etwa com.apple.Preview für pdf und Bilder, com.apple.TextEdit und com.microsoft.VSCode für txt und md, com.microsoft.Word, com.microsoft.Excel, com.microsoft.Powerpoint, org.libreoffice.script, com.apple.iWork.Pages, Numbers, Keynote); so öffnet nie ein Programm außerhalb der Liste, und die Frage, was dem Typ zugeordnet ist, entfällt. Wer das Windows-Verhalten genau nachbilden will (zugeordnetes Programm fragen, dann gegen die Liste prüfen), braucht Launch Services (LSCopyDefaultApplicationURLForURL aus CoreServices per FFI); das ist die teurere Variante. Ordner: /usr/bin/open -R <Pfad> (im Finder zeigen) statt den Ordner selbst zu öffnen, weil ein Ordner mit Endung .app oder ein anderes Paket von open gestartet statt gezeigt würde; das ist das macOS-Gegenstück zur Windows-Sorge Werkzeugkiste wird zu Werkzeugkiste.cmd. zip: ebenfalls open -R (ein zip zu öffnen würde es unter macOS entpacken). Die Liste der verbotenen Endungen in src/oeffnen (andere Scheibe) braucht macOS-Einträge (app, command, terminal, tool, workflow, scpt, pkg, dmg, webloc, inetloc); weil hier eine Positivliste von 16 Endungen gilt, ist das zweite Linie.",
  "Folge für Windows: Verhalten gleich. Geteilter Code: PROGRAMME wird je Plattform eine eigene Tabelle; der Test-Ersatz Aufnahme (oeffnen.rs:227-244) ruft heute explorer_befehl und muss plattformneutral aufschreiben (Art und Pfad) oder die Windows-Form nur unter Windows prüfen. Der Satz in :318 sollte Das System statt Windows sagen (DB18).",
  "Prüfung: Vorhanden: oeffnen.rs:323-625, mit Aufnahme statt echtem Öffnen. Neu: reine Funktion mac_aufruf(pfad, art) liefert Programm und Argumentliste (/usr/bin/open, -b, Kennung, Pfad); Tests dazu laufen unter Windows, ohne etwas zu öffnen. Am Mac selbst von Hand zu prüfen (lässt sich nicht automatisieren): Ordner mit Endung .app wird gezeigt, nicht gestartet; Datei mit Leerzeichen und Umlaut; zip. Diese drei Handproben gehören als Liste in die Studie.",
  "Aufwand: mittel (Variante open -b), gross (Variante Launch Services per FFI).",
]

[[block]]
titel = "DB13: Verteiler der Boten-Aufgaben ruft Windows-Datenquellen"
punkte = [
  "Ort: src/bote/aufgaben.rs:308-395, darin :316 (eigene Sitzung, WTS), :320-343 (Tresor, Satz Der Windows-Tresor hat den Wert nicht angenommen :340), :344-347 (winget), :348-351 (Autostart), :365 (Werkzeuge); Fristen src/bote/client.rs:162-169; Sätze src/bote/sammler.rs:115-157.",
  "Was an Windows hängt: Die Aufgaben reichen an Module anderer Scheiben weiter: schluessel (Anmeldeinformationsverwaltung), pc::sysapps (winget, Autostart aus der Registry, Werkzeug-Versionen), pc::sitzung (Sitzung des Boten).",
  "Heute außerhalb von Windows: Der Verteiler selbst ist neutral. Die Ziele liefern Stubs: cred_info None, cred_write Fehler (src/schluessel.rs:324-331), eigene_sitzung None (src/pc/sitzung.rs:376-379); winget, Autostart und Werkzeuge siehe Scheibe pc. Inventar, RepoStempel, Fortschritt und Bau sind neutral (Bau hängt an DB08, DB14, DB10).",
  "Schwere: Funktion fehlt (Ursache und Vorschlag liegen in den Scheiben schluessel und pc)",
  "Vorschlag für macOS: In dieser Scheibe nichts außer den Sätzen: Tresor statt Windows-Tresor. Fachlich in den anderen Scheiben: Schlüsselbund über Security.framework oder /usr/bin/security; statt winget Homebrew (brew list) oder abschalten; Autostart aus LaunchAgents und Anmeldeobjekten oder abschalten; Sitzung entfällt unter macOS, weil der Server selbst in der Sitzung des Benutzers läuft.",
  "Folge für Windows: nichts.",
  "Prüfung: Vorhanden: hallo_und_fremde_ziele (aufgaben.rs:501-520) läuft überall. Rest in den anderen Scheiben.",
  "Aufwand: klein (hier), der eigentliche Aufwand steht bei schluessel und pc.",
]

[[block]]
titel = "DB05: Windows-Dienst: Anbindung an den Dienststeuerungs-Manager"
punkte = [
  "Ort: src/dienst/windows.rs:1-127 (ganze Datei, Kiste windows-service); src/dienst/mod.rs:16-17 (Modul nur Windows), :32-67 (Fristen nach SCM und WaitToKillServiceTimeout, Stoppart), :69-88 (Modus Dienst), :123-125 (Hilfe), :146-149 und :200 (Aufruf Dienst, Standardname Dashboard), :471-550 (Zustand, Dienststatus, ablauf, stopp_anfordern, stopp_abwarten, dienst_laufen mit dem Hinweis Windows-Dienst :549); src/start.rs:45, :53-62 (Windows), :64-68 (Rückfall).",
  "Was an Windows hängt: --dienst übergibt den Hauptfaden an den SCM, meldet StartPending, Running, StopPending, Stopped mit dienstspezifischem Code und nimmt Stop und Shutdown an.",
  "Heute außerhalb von Windows: Das Modul windows wird nicht übersetzt. --dienst schreibt einen Satz und endet mit 2 (start.rs:64-68). Die Zustandsfolge in mod.rs:471-550 ist plattformneutral und wird überall übersetzt und getestet, aber nicht benutzt.",
  "Schwere: Funktion fehlt (Start beim Anmelden und Neustart nach Absturz)",
  "Vorschlag für macOS: entfällt unter macOS als Code: launchd braucht keine Anmeldung im Programm. Ein LaunchAgent in ~/Library/LaunchAgents (etwa de.dashboard.server.plist) startet dashboard --konsole --einstellungen <datei> mit RunAtLoad, KeepAlive (nur bei Absturz: SuccessfulExit false, damit Code 2 Einstellungen falsch nicht zur Endlosschleife wird), ExitTimeOut, StandardOutPath und StandardErrorPath in den Protokollordner. Voraussetzung im Code ist nur DB06 (SIGTERM). Optional ein eigener Name für die Startart (etwa --agent als zweiter Name für --konsole ohne Ausgabe in die Konsole), damit /api/betrieb nicht konsole meldet; das wäre ein neuer Wert im Vertrag und ist nicht nötig. Die Exit-Codes 0, 2, 3, 9 bleiben und sind für launchd brauchbar. Ein Einrichtungsskript für die plist gehört zu den Skripten (andere Scheibe).",
  "Folge für Windows: nichts.",
  "Prüfung: Vorhanden: dienst_meldet_start_lauf_stopp_und_ende, dienst_endet_mit_eigenem_code_bei_startfehler, panik_im_dienst_meldet_stopped_9 (dienst/mod.rs:608-711) laufen überall mit einer Attrappe. Die plist prüft ohne Mac niemand; mit plutil -lint in einem macOS-Runner lässt sich die Form prüfen, das Laden mit launchctl bootstrap gui/<uid> nur am Mac.",
  "Aufwand: klein im Code, mittel mit Einrichtungsskript.",
]

[[block]]
titel = "PC-B1: Öffnen, das ganze Pfadmodell ist ein Windows-Modell"
punkte = [
  "Ort: src/oeffnen/mod.rs:15-36 (Regeln im Kopf), 47-84 (Endungslisten, VERBOTENE_ENDUNGEN 55-84), 100-117 (Art, Ziel), 161-191 (Sätze), 263-271 (teile schneidet die ersten 3 Bytes X:\\ ab), 273-292 (Gerätenamen, Kurznamen ~1, Shell-Ordner .{GUID}), 294-335 (form_pruefen: Zeile 304-307 UNC und Gerätepfad, 308-310 Laufwerk Pflicht, 311-313 Datenstrom), 352-359 (kanonisch_text wandelt / in \\ und entfernt \\\\?\\), 361-379 (vergleichsformen und unter: klein, mit \\), 381-384 (programdata, C:\\ProgramData), 386-403 (lage_pruefen: AppData 392, ProgramData 396), 405-407, 418-436 (laufwerk_pruefen mit GetDriveTypeW; Ersatz 433-436), 438-458 (namen_zahl; Unix-Zweig 454-458 vorhanden), 463-501 (pruefen; Komma-Regel 477-479; Ziel.pfad aus Text mit \\), 551-555 (eigenes_profil nur USERPROFILE), 610-640; Nutzer: src/inhalt/pruefung.rs:600-694 (orte_regeln_beim_bau, orte_befunde, ort_endung), src/vertrag/daten.rs:519 (Pfad mit Laufwerk), src/vertrag/bote.rs:91-95 (Anfrage::Oeffnen)",
  "Was an Windows hängt: Ein Ort ist nur gültig als X:\\... Verglichen wird als Text in Kleinbuchstaben mit \\. Verboten sind AppData, ProgramData, Ordner des Dienstes, Netzlaufwerke (GetDriveTypeW). Geöffnet wird im Boten mit ShellExecute bzw. explorer.exe (fremde Scheibe).",
  "Heute außerhalb von Windows: Jeder macOS-Pfad scheitert in form_pruefen Zeile 308-310 mit NichtAbsolut, Satz: Der Pfad muss vollständig mit Laufwerk sein, etwa C:\\… (Zeile 166). eigenes_profil ist None (554), der Server antwortet 503 profil-fehlt (src/api/oeffnen.rs:160). laufwerk_pruefen ist ein No-op (434-436). Die Prüfung beim Bau meldet jeden macOS-Ort als Fehler geht nie auf.",
  "Vorschlag für macOS: Pfadmodell als eigenen Typ (Windows, Posix), den form_pruefen, teile, klein, unter, kanonisch_text und lage_pruefen als Parameter bekommen; reine Funktionen, beide Modelle auf jeder Plattform testbar. POSIX-Modell: absolut mit / vorn, kein // vorn, kein . und .., keine Steuerzeichen, kein %, kein Doppelpunkt (Finder zeigt ihn als /), kein .git; Teile ab Index 1 statt 3; Vergleich mit /, Groß/Klein gleich (APFS-Standard), Unicode-Form vereinheitlichen (NFC gegen NFD, sonst käme ein Tabu-Name mit Umlaut in anderer Zerlegung vorbei; siehe Unsicher). Wurzeln: Profil aus HOME, Inhaltsquellen. Verboten statt AppData und ProgramData: <Profil>/Library, /Library, /System, /private, /Applications, versteckte Teile mit Punkt vorn (.ssh, .gnupg, .config) nach Entscheidung. Netz statt GetDriveTypeW: statfs, Flag MNT_LOCAL bzw. Dateisystemtyp smbfs, afpfs, nfs, webdav ablehnen. Öffnen selbst (Bote): /usr/bin/open <Datei> für Dateien der Positivliste. Achtung Ordner: Ein Ordner mit Endung kann ein Paket sein (.app, .workflow, .prefPane, .pkg, .scptd, .terminal); open auf ein Paket startet es. Darum Ordner mit Endung und zip nur zeigen (open -R, markiert im Finder, startet nichts; zip würde sonst vom Archivprogramm entpackt), einfache Ordner mit open. Die Komma-Regel (477-479) entfällt unter macOS, weil der Pfad ein einzelnes Argument ist. Die Positivliste der zugeordneten Programme (fremde Scheibe) braucht einen Ersatz (LaunchServices; je Datei kann das erweiterte Attribut com.apple.LaunchServices.OpenWith ein anderes Programm festlegen).",
  "Folge für Windows: gemeinsamer Code wird umgebaut (Modell als Parameter), das Verhalten unter Windows bleibt; alle bestehenden Tests in src/oeffnen/tests.rs müssen unverändert grün bleiben, das ist die Sicherung.",
  "Prüfung: Neue Tests für das POSIX-Modell als reine Textprüfung (vorpruefen), unter Windows lauffähig. Die Teile mit Platte (canonicalize, statfs, nlink, open) nur auf macOS: CI auf einem macOS-Runner; dazu cross-check. Tabelle mit Fällen (Paket-Ordner, Library, Netz-Volume, harte Verknüpfung, Symlink aus dem Profil hinaus) als Abnahmeliste.",
  "Aufwand: groß; sicherheitskritischer Kern mit etwa 30 Regeln, Umbau gemeinsamen Codes und neues Bedrohungsmodell (Pakete, TCC, OpenWith).",
]

[[block]]
titel = "PC-B2: Werkzeugsuche aus Sicht der Aufrufer, node, npm, cargo und PowerShell fehlen"
punkte = [
  "Ort: src/werkzeug/stil.rs:87 (Stylelint über Node); src/werkzeug/projektpruefung.rs:42-45 (node), 108-121 (ESLint), 243-245, 321-323 (svelte-check, Vitest); src/werkzeug/scanner.rs:1792-1802 (svelte-check); src/baumeister.rs:178-205 (ueber_boten, direkt); src/git.rs:53-66; src/projekte/zusammenbau.rs:665; src/pc/sysapps.rs:171-191, 292-302; src/pc/system.rs:579-587; Testhilfe src/inhalt/seite.rs:185. Die Suche selbst: src/dienst/programme.rs:94-100 (fremde Scheibe): außerhalb von Windows gibt es nur /usr/bin/git, alles andere ist eine leere Liste.",
  "Was an Windows hängt: Jedes Kindprogramm kommt nur von festen Windows-Orten, nie aus dem PATH.",
  "Heute außerhalb von Windows: git geht (/usr/bin/git). Node: programme::befehl liefert den Satz node nicht gefunden (nur an festen Orten gesucht, nicht im PATH) (programme.rs:165-167). Folgen: Stylelint, ESLint, Vitest und svelte-check melden je einen Hinweis ist übersprungen (projektpruefung.rs:81-83, scanner.rs:1774); im Bau zählt übersprungen als nicht geprüft (projektpruefung.rs:88-90), pruefe --bauliste --svelte schreibt dann die leere Bauliste (Kopf von src/werkzeug/pruefe.rs, Zeile 53-56). Der Baumeister baut nur über den Boten; ohne Boten kommt der Satz Ohne Boten baut das Dashboard nicht ... Gebaut wird dann mit Dienst.ps1 -Neustart (baumeister.rs:186), mit DASHBOARD_BAUMEISTER=direkt scheitert der Bau an npm nicht gefunden. cargo und rustc: Werkzeugliste zeigt nicht gefunden. Übrig bleibt unter macOS: pruefe mit TOML-Prüfung und Scanner.",
  "Vorschlag für macOS: In dienst::programme einen macOS-Zweig mit festen Orten: Node /opt/homebrew/bin/node, /usr/local/bin/node (npm-cli daneben unter lib/node_modules/npm/bin/npm-cli.js); cargo und rustc ~/.cargo/bin; git /usr/bin/git, optional /opt/homebrew/bin/git (siehe PC-E3); neue Werkzeuge open, sw_vers, spctl, fdesetup, launchctl, brew. Node aus nvm, fnm, volta oder asdf liegt an keinem festen Ort; dafür ein einstellbarer Pfad in den Einstellungen statt einer PATH-Suche (die Regel nie aus dem PATH ist eine Sicherheitsentscheidung). Hinweis: /opt/homebrew ist ohne Administrator beschreibbar, anders als Program Files; das schwächt die Annahme fester Ort gleich vertrauenswürdig.",
  "Folge für Windows: nichts, nur neuer cfg-Zweig in kandidaten; neue Werkzeug-Varianten sind unter Windows leer.",
  "Prüfung: Orte::kandidaten ist rein und bekommt die Umgebung als Struktur; Einheitstests mit erfundenen Ordnern wie die vorhandenen (programme.rs:320-370), dafür die Plattform als Parameter statt cfg!, dann unter Windows lauffähig. Der Test kein_command_ausserhalb (programme.rs:453) hält neue Command-Stellen außerhalb auf und bleibt.",
  "Aufwand: mittel; wenig Code, aber die Entscheidung zu Homebrew und Versionsverwaltern von Node ist offen.",
]

[[block]]
titel = "PC-B3: PC-Seite, Prozessorlast"
punkte = [
  "Ort: src/pc/system.rs:357-399 (cpu_zeiten mit GetSystemTimes 382-394; Ersatz 396-399), 426, 441-447, 75-96 (cpu_setzen), 501",
  "Was an Windows hängt: Die Last kommt nur aus GetSystemTimes; sysinfo ist bewusst abgewählt, weil es im Windows-Dienst 0 % lieferte (Kommentar 359-361).",
  "Heute außerhalb von Windows: cpu_zeiten gibt None (397-399); cpu_setzen(None) setzt cpu_percent 0 und cpu_belegung unbekannt (85-88, 92-96); im Verlauf bleibt cpu null (Zeile 462). Die Seite zeigt dauerhaft unbekannt.",
  "Vorschlag für macOS: cfg(target_os = macos) für cpu_zeiten: sysinfo ist schon Abhängigkeit (System::refresh_cpu_usage und global_cpu_usage); sauberer passt host_statistics64 mit HOST_CPU_LOAD_INFO aus libc (liefert Ticks für user, system, idle, nice und lässt sich genau auf CpuZeiten abbilden, kern einschließlich Leerlauf), dann bleibt cpu_auslastung unverändert.",
  "Folge für Windows: nichts, nur neuer cfg-Zweig.",
  "Prüfung: cpu_auslastung ist rein und getestet (system.rs:764-781). Der neue Zweig: cross-check, CI auf macOS-Runner mit dem Gegenstück zum Test in 777-781 (kern >= leerlauf).",
  "Aufwand: klein.",
]

