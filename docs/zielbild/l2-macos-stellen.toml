[[block]]
titel = "DB09: Schalter beim Start von Kindprozessen: ohne Fenster, niedrige Priorität"
punkte = [
  "Ort: src/dienst/programme.rs:169-201 (CREATE_NO_WINDOW, ohne_fenster, ohne_fenster_async), :203-218, :220-249 (BELOW_NORMAL_PRIORITY_CLASS, befehl_niedrig, befehl_niedrig_async, niedrig_async), :272-279 (eigener_befehl); Verwendung src/bote/bau.rs:1587-1588, src/bote/waechter.rs:97-98.",
  "Was an Windows hängt: Kein Kindprozess darf ein Konsolenfenster aufblitzen lassen; der Bau läuft mit niedriger Prioritätsklasse, die Windows an Enkel vererbt.",
  "Heute außerhalb von Windows: Alle diese Funktionen geben den Befehl unverändert zurück (cfg(windows) nur um die Zeile mit creation_flags, programme.rs:188-192, :198-199, :228-232, :239-240, :246-247). Ohne Fenster ist unter macOS ohnehin so. Die niedrige Priorität fehlt: Der Bau läuft mit normaler Priorität.",
  "Vorschlag für macOS: Ohne Fenster: entfällt unter macOS, weil ein Kindprozess dort nie ein Fenster bekommt. Priorität: cfg(unix)-Zweig in den drei Funktionen mit pre_exec und setpriority (Wert 10) oder gleichwertig; die Priorität vererbt sich unter Unix an Kinder. Nicht /usr/bin/nice davor setzen, weil bau.rs:1591 den Ordner von Node aus dem Programm des Befehls ableitet.",
  "Folge für Windows: nichts, nur neuer cfg-Zweig.",
  "Prüfung: Vorhanden: befehle_ohne_fenster_laufen (programme.rs:415-426, nur Windows). Neu unter cfg(unix): Kind gibt seine Priorität aus (ps -o nice= -p <pid>) und der Test erwartet 10; läuft auf Linux, also ohne Mac.",
  "Aufwand: klein.",
]

