titel = "macOS: alle Stellen, die an Windows hängen"
reihenfolge = 14
text = "Dieser Abschnitt gehört zur Studie über den Betrieb unter macOS (Abschnitt „macOS: Studie zur Portierung“). Er listet jede Stelle auf, die an Windows hängt, geordnet nach Schwere. Je Stelle stehen: der Ort mit Datei und Zeile, was an Windows hängt, was der Code heute außerhalb von Windows tut, der Vorschlag für macOS, die Folge für Windows, wie sich der Schritt prüfen lässt (auch ohne Mac) und der Aufwand.\n\nGrundlage: der Quelltext am Stand dabe5d1 (Fassung 0.3.0), gelesen und nicht gebaut. Ausgangspunkt war eine Suche nach allen Zeilen mit Windows-Bezug in src, crates, projects, vorlagen, tests, Cargo.toml und .cargo: 1249 Zeilen. Jede davon ist einer Stelle zugeordnet oder als Kommentar, Testwert oder harmlos gezählt; die Zählung steht am Ende. Dazu kommen Stellen, die keine Suche findet, weil in der Zeile kein Windows-Wort steht.\n\nKennungen: DB steht für Dienst und Bote (src/bote, src/bin, src/dienst, src/start.rs, src/app.rs), PC für PC-Seite, Öffnen, Datenschutz, Werkzeuge, Inhalt, Projekte und den Rest von src sowie crates und vorlagen, AN für Anmeldung, Speicher, Passkey, Schlüssel und die API. Skripte, Tests in tests/ und die Werkzeuge der Oberfläche stehen im Abschnitt „macOS: prüfen, auch ohne Mac“."

