[[block]]
titel = "PC-B11: Ist der Inhaber angemeldet (WTS-Sitzungen)"
punkte = [
  "Ort: src/pc/sitzung.rs:1-69 (Regel), 79-113 (SitzungsFehler::NurWindows 88-89, 99, 110), 307-345 (Wts mit WTSGetActiveConsoleSessionId, WTSQuerySessionInformationW), Ersatz 347-360, 362-379 (eigene_sitzung; Ersatz 376-379), 381-459 (sitzungs_info, utf16_text, sid_von_konto); Nutzer src/meldungen.rs:521-551, 752-760; src/vertrag/bote.rs:228",
  "Was an Windows hängt: Ob der Inhaber angemeldet ist, fragt der Dienst über die WTS-Schnittstelle von Windows (Konsolensitzung, Zustand, Konto der Sitzung als SID).",
  "Heute außerhalb von Windows: konsole() None, zustand und konto_sid Err(NurWindows) (349-359); pruefen fällt in ersatz (214-227): mit verbundenem Boten angemeldet (Quelle bote), sonst unbekannt. eigene_sitzung None. /api/betrieb zeigt die Fehlerart nur-windows. Die Meldung Bote fehlt kommt dann aus dem Ersatzweg nur eingeschränkt.",
  "Vorschlag für macOS: Hängt am Botenmodell (fremde Scheibe). Läuft unter macOS alles im Konto des Inhabers als LaunchAgent, gibt es keinen getrennten Boten und die Frage entfällt (Stub bleibt, Fehlerart umbenennen in nicht-noetig). Mit getrenntem Dienst: Konsolenbenutzer über stat -f %Su /dev/console oder SCDynamicStoreCopyConsoleUser, verglichen mit dem Kurznamen des Inhabers; das Trait SitzungsAbfrage (sitzung.rs:170-182) trägt das, die SID wird zum Kontonamen.",
  "Folge für Windows: nichts, nur anderer Zweig hinter dem Trait.",
  "Prüfung: Die Regel ist vollständig über FalscheAbfrage getestet (sitzung.rs:461-666) und läuft überall; neue Fälle für den macOS-Zweig ebenso. Echte Abfrage nur auf macOS.",
  "Aufwand: klein (entfällt) oder mittel (eigene Abfrage).",
]

[[block]]
titel = "PC-B12: Leserechte des Dienstkontos prüfen (DACL, icacls)"
punkte = [
  "Ort: src/werkzeug/rechte.rs:1-36 (Kopf), 42 (C:\\ProgramData\\Dashboard\\dienst.toml), 46-48 (Gruppen-SIDs), 104-133, 162-173 (pruefen, Abzweig 166), 175-210 (befunde, Abzweig 179), 212-227 (Satz mit icacls /reset und %TEMP%), 229-240 (ist_umleitung; Ersatz 237-240), 242-309 (darf_lesen mit GetNamedSecurityInfoW), Ersatz 311-314; Aufruf in src/werkzeug/pruefe.rs (Kopf 18-21)",
  "Was an Windows hängt: pruefe liest die DACL jeder Datei der Inhaltsquellen und meldet, was das Dienstkonto (SID aus dienst.toml) nicht lesen darf, mit dem Befehl icacls zum Beheben.",
  "Heute außerhalb von Windows: pruefen gibt eine leere Liste zurück (166-168), ohne Hinweis; darf_lesen None.",
  "Schwere: Funktion fehlt (nur mit getrenntem Dienstkonto von Belang)",
  "Vorschlag für macOS: entfällt unter macOS, wenn der Dienst im Konto des Inhabers läuft (kein zweites Konto, das nicht lesen dürfte). Mit eigenem Dienstkonto: POSIX-Rechte (Besitzer, Gruppe, Modus) und ACL prüfen, Befehl zum Beheben chmod bzw. chmod -R +a. Zusätzlich neu unter macOS: der Systemschutz TCC verweigert Dokumente, Schreibtisch, Downloads und iCloud ohne Freigabe (EPERM); das ist kein Dateirecht und braucht einen eigenen Satz in src/meldungen.rs:657-670.",
  "Folge für Windows: nichts.",
  "Prüfung: Die Regel lesen_erlaubt ist rein und getestet (rechte.rs:320-366). Ein POSIX-Zweig wäre eine reine Funktion über Modus, uid, gid und unter Windows mit erfundenen Werten testbar.",
  "Aufwand: klein (entfällt, ein Hinweis-Satz) bis mittel.",
]

[[block]]
titel = "PC-B13: Herzschlag (Stop-Hook eines Chats)"
punkte = [
  "Ort: src/herzschlag/mod.rs:1-2, 22-26 (zustand_ordner nur aus LOCALAPPDATA), 33-62; src/herzschlag/abfrage.rs:1-6, 123-149 (Negotiate mit SSPI), Ersatz 151-154; src/herzschlag/adapter.rs:77-82; src/herzschlag/HERKUNFT.toml:26",
  "Was an Windows hängt: Zustandsdateien unter %LOCALAPPDATA%\\Dashboard\\herzschlag; die Abfrage GET /api/sitzungen/<id>/offen meldet sich mit der Windows-Anmeldung (Negotiate, SSPI) an.",
  "Heute außerhalb von Windows: Doppelt wirkungslos: zustand_ordner ist None, adapter::execute gibt dann sofort das leere Ergebnis zurück (adapter.rs:82), Exit 0, der Stop geht durch. Selbst mit Ordner scheitert holen mit Die Windows-Anmeldung gibt es nur unter Windows. (abfrage.rs:153), was als durchlassen zählt. Der Hook hält nie auf und schreibt nichts.",
  "Vorschlag für macOS: Zustand unter ~/Library/Application Support/Dashboard/herzschlag (oder $XDG_STATE_HOME, das Original nutzte HOME/.local/state laut HERKUNFT.toml:26). Die Anmeldung hängt an der Scheibe anmeldung: ohne Negotiate braucht es einen anderen Nachweis auf 127.0.0.1, etwa ein Token in einer Datei mit Modus 0600 oder einen Unix-Socket mit Prüfung der Gegenstelle (getpeereid).",
  "Folge für Windows: nichts für den Ordner (cfg-Zweig); die Anmeldung wäre ein zweiter Weg neben Negotiate.",
  "Prüfung: zustand_ordner als reine Funktion über eine übergebene Umgebung, Einheitstest unter Windows. Graph und Adapter sind plattformneutral und getestet (src/herzschlag/tests.rs, Fixtures in src/herzschlag/fixtures/).",
  "Aufwand: klein für den Ordner; die Anmeldung ist Teil eines fremden, großen Schritts.",
]

[[block]]
