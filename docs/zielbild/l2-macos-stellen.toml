[[block]]
titel = "DB20: Tests: nur unter Windows übersetzt oder unter macOS rot"
punkte = [
  "Ort: Nur unter Windows (cfg(windows)): src/bote/mod.rs:162-178; src/bote/server.rs:212-400 (ganzes Modul nur Windows, acht Tests); src/bote/aufgaben.rs:482-499, :508-509; src/bote/oeffnen.rs:564-601; src/bote/waechter.rs:346-351 (Zeile :348-349); src/dienst/programme.rs:320-380, :382-409, :415-433; src/dienst/mod.rs:714-822, :838-846, :855-856; src/dienst/betrieb.rs:228-239; src/app.rs:1877-1899, :1981 ff. (Junction mit mklink). Test-Helfer mit Folgen für viele Tests: src/app.rs:606-612 (router_angemeldet merkt die Anmeldung nur unter cfg(windows), :609-610). Ohne Bedingung, aber nach Lesen unter macOS rot: src/dienst/einstellungen.rs:394-401 (Muster gut() trägt programm = C:/ProgramData/...) und damit :417-434, :436-451, :481-520, :522-527, :531-540 (fünf Tests, Ursache DB15); src/dienst/programme.rs:434-446 (npm_liegt_neben_node zerlegt einen Pfad mit Rückstrichen); src/bote/oeffnen.rs:373-406, :548-562, :606-624 (drei Tests brauchen explorer_befehl, Ursache DB12 und DB08). Integrationstests tests/bote_pipe.rs und tests/dienst_konsole.rs gehören zu einer anderen Scheibe, hängen aber an DB02 und DB15.",
  "Was an Windows hängt: Tests prüfen Win32-Verhalten oder setzen Windows-Pfade und Windows-Werkzeuge voraus.",
  "Heute außerhalb von Windows: Die cfg(windows)-Tests fehlen im Lauf (gewollt). Die genannten Tests ohne Bedingung scheitern nach meiner Lesart. Ohne die Anmeldung in router_angemeldet bekommen unter macOS vermutlich alle Tests geschützter Wege 401 statt des erwarteten Ergebnisses; das betrifft in app.rs die Aufrufe :1092, :1292, :1401, :1570, :1615, :1767, :1788, :1807 und viele Tests anderer Module (Ursache in der Scheibe anmeldung).",
  "Vorschlag für macOS: Je Test entscheiden: (1) Win32-Tests bleiben cfg(windows). (2) Tests mit Windows-Pfaden als Text plattformneutral aus Teilen bauen (programme.rs:438-439) oder Erwartung je Plattform. (3) Das Muster gut() in einstellungen.rs ohne Zeile programm schreiben, sobald DB15 gilt, oder den Pfad aus temp_dir bilden. (4) Die drei Öffnen-Tests auf den plattformneutralen Test-Ersatz umstellen (DB12). (5) router_angemeldet braucht eine Test-Anmeldung, die es auf jeder Plattform gibt (hängt an der Entscheidung der Scheibe anmeldung).",
  "Folge für Windows: Testcode ändert sich, Verhalten nicht; die Erwartungen unter Windows bleiben wörtlich gleich.",
  "Prüfung: cargo test auf einem macOS-Runner ist hier das eigentliche Prüfmittel; ohne Mac zeigt cargo test auf Linux fast dieselben Ausfälle, weil alle Zweige cfg(not(windows)) sind. Als erster Schritt der Studie empfehle ich einen Lauf nur zum Zählen (keine Korrektur), damit die Liste oben gemessen statt gelesen ist.",
  "Aufwand: mittel, viele kleine Stellen.",
]

