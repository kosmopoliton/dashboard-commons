[[block]]
titel = "PC-C3: Zusammenbau-Wächter, Finder-Dateien machen die Kiste rot"
punkte = [
  "Ort: src/projekte/zusammenbau.rs:218-251 (dateien), 253-297 (vorlage_vergleichen, Fund in 279-281); Regel im Kopf Zeile 15-20",
  "Was an Windows hängt: In der Zusammenbau-Kiste darf nur liegen, was die Vorlage hat; jede weitere Datei ist ein Fund.",
  "Heute außerhalb von Windows: Der Wächter läuft (liest Dateien, fragt git). Legt der Finder eine .DS_Store in dashboard-lokal an, ist das eine Datei, die nicht in der Vorlage steht: Fund, kein Bau. Ebenso bei einer Kiste, die seit ihrem Commit ohne neue oder ignorierte Dateien sein muss (Kopf Zeile 41-44).",
  "Schwere: Eingeschränkt (scheitert geschlossen, aber störend)",
