[[block]]
titel = "Falsches Verhalten (13)"
text = "Das Programm läuft an diesen Stellen, tut aber etwas Falsches oder Unsicheres. Dazu gehören Lücken im Datenschutz auf den freien Wegen."

[[block]]
titel = "DB15: Einstellungsdatei: Standardwert bote.programm und Prüfung vollständiger Pfad"
punkte = [
  "Ort: src/dienst/einstellungen.rs:190-192 (Standard C:/ProgramData/Dashboard/bin/dashboard-bote.exe), :229-238 (Prüfung absolut mit dem Satz Bitte einen vollständigen Pfad mit Laufwerk angeben), :239, :243-247, :257, :261, :266, :272, :276 (Beispielpfade C:/... in den Fehlersätzen), :295-299 (bote.pipe und bote.programm), :111-117 (Typ Bote); Verwendung von programm in src/bote/client.rs:245, :288, :546-548 und src/oeffnen/mod.rs:651 (andere Scheibe).",
  "Was an Windows hängt: Der Standardwert für bote.programm ist ein Windows-Pfad mit Laufwerk und Endung .exe. Er läuft durch dieselbe Prüfung PathBuf::is_absolute wie alle Pfade der Datei. Die Fehlersätze nennen Laufwerke und C:/Users/<name>.",
  "Heute außerhalb von Windows: Unter macOS ist C:/ProgramData/... kein absoluter Pfad. Eine dienst.toml ohne Abschnitt [bote] oder ohne programm wird darum mit dem Satz Bei bote.programm steht ... Bitte einen vollständigen Pfad mit Laufwerk angeben abgelehnt (einstellungen.rs:231-236 über :299); --konsole endet mit 2 (dienst/mod.rs:428-433). Wer programm = \"/irgendein/pfad\" einträgt, kommt durch. Die Sätze mit Laufwerk führen unter macOS in die Irre.",
  "Vorschlag für macOS: Standardwert je Plattform: unter Windows wie bisher, sonst der Pfad des Programms dashboard-bote neben dem laufenden Programm (std::env::current_exe, Elternordner), ohne Endung. Wird der Bote unter macOS im eigenen Prozess geführt (DB01), wird bote.programm und bote.pipe dort gar nicht gelesen; dann genügt es, den Standard nur unter Windows durch die Prüfung absolut zu schicken und die Felder sonst als freiwillig zu behandeln. Fehlersätze: das Wort mit Laufwerk und die Beispiele aus einer kleinen Funktion beispiel_pfad(schluessel) holen, die je Plattform C:/ProgramData/Dashboard/... oder /Users/<name>/.var/dashboard/... liefert.",
  "Folge für Windows: Verhalten gleich. Geteilter Code wird angefasst: die Funktion standard_bote_programm bekommt einen cfg-Zweig, die Beispieltexte ziehen in eine Funktion um. Die Tests, die den Wortlaut der Sätze prüfen (einstellungen.rs:549-582), bleiben unter Windows unverändert grün.",
  "Prüfung: Vorhandene Tests in einstellungen.rs:373-599 decken Laden, Standardwerte und Sätze ab; fünf davon scheitern heute unter macOS genau an dieser Stelle (siehe DB20). Neu: Test dienst.toml ohne [bote] lädt auf jeder Plattform. Ohne Mac prüfbar: die Entscheidung in eine reine Funktion standard_bote_programm_fuer(plattform, ordner_des_programms) legen und beide Zweige unter Windows testen; dazu cargo check --target aarch64-apple-darwin und Lauf der Tests auf einem macOS-Runner (oder Linux, der Zweig ist cfg(not(windows))).",
  "Aufwand: klein, eine Funktion und Texte.",
]

[[block]]
titel = "DB14: Bau der Oberfläche: PATH wird mit Semikolon zusammengesetzt"
punkte = [
  "Ort: src/bote/bau.rs:1589-1596 (Kommentar :1589-1590, Ordner von Node :1591, Trenner :1594), :1600 (env PATH). Verwandt, aber ohne Handlungsbedarf: Liste DASHBOARD_PROJECTS_DIR mit Semikolon in src/dienst/einstellungen.rs:18-19 und :354-361, src/app.rs:981-989, src/bote/bau.rs:1607 (Trenner selbst in src/quellen.rs:139-141 und :294-296, andere Scheibe).",
  "Was an Windows hängt: Der Ordner von Node wird vor den geerbten PATH gehängt, getrennt durch ein fest eingetragenes Semikolon (Windows-Listentrenner). Der Kommentar nennt cmd.exe als Aufrufer der Skripte.",
  "Heute außerhalb von Windows: Der Code läuft, baut aber einen falschen PATH: aus /opt/homebrew/bin und /usr/bin:/bin wird /opt/homebrew/bin;/usr/bin:/bin. Der erste Eintrag heißt dann /opt/homebrew/bin;/usr/bin und existiert nicht; der Ordner von Node UND der erste geerbte Eintrag sind verloren. Die Skripte in package.json finden node und vite dann nur noch zufällig. Kein Rückfallzweig, die Zeile gilt für alle Plattformen.",
  "Vorschlag für macOS: std::env::split_paths und std::env::join_paths aus der Standardbibliothek nehmen (Trenner je Plattform, unter macOS Doppelpunkt). Die Liste DASHBOARD_PROJECTS_DIR dagegen so lassen: das Semikolon ist dort ein eigenes Format des Dashboards, das auch vite.config.ts liest, und in macOS-Pfaden unüblich; ein Wechsel auf Doppelpunkt bräche die Gleichheit zwischen den Plattformen. In der Studie nur als bewusste Entscheidung festhalten.",
  "Folge für Windows: nichts im Ergebnis (join_paths setzt unter Windows dasselbe Semikolon); die drei Zeilen werden für alle Plattformen ersetzt.",
  "Prüfung: Neu: kleine reine Funktion pfad_mit_node(node_ordner, alter_pfad) mit Test, der das Ergebnis mit split_paths wieder zerlegt und node_ordner an erster Stelle sowie alle alten Einträge erwartet; läuft unter Windows und macOS gleich und braucht keinen Mac. Vorhandene Bau-Tests mit echtem npm (bau.rs ab :1840, etwa :3537-3570) laufen nach DB08 auch unter macOS.",
  "Aufwand: klein, drei Zeilen und ein Test.",
]

[[block]]
titel = "DB06: Geordnetes Beenden hört nur auf Strg+C, nicht auf SIGTERM"
punkte = [
  "Ort: src/dienst/mod.rs:398-405 (strg_c mit tokio::signal::ctrl_c), verwendet in :423 und :442; Fristen :32-48; im Boten src/bote/server.rs:95-100 (nur Windows übersetzt). Kein Treffer in der Liste.",
  "Was an Windows hängt: Das Signal zum Beenden ist allein Strg+C. Unter Windows kommt der Stopp des Dienstes über den Dienststeuerungs-Manager (DB05). Unter Unix ist ctrl_c von tokio nur SIGINT.",
  "Heute außerhalb von Windows: Strg+C im Terminal beendet geordnet. SIGTERM (so beendet launchd einen Agenten, ebenso kill und das Abmelden) und SIGHUP (Terminal geschlossen) werden nicht abgefangen: Der Prozess endet sofort, ohne Abschaltsignal an offene Antworten, ohne die Frist von 8 s und ohne dass der Datenspeicher (redb) geordnet schließt.",
  "Vorschlag für macOS: In strg_c einen cfg(unix)-Zweig: zusätzlich auf SIGTERM und SIGHUP warten (tokio::signal::unix::signal mit SignalKind::terminate und SignalKind::hangup; das Feature signal ist in Cargo.toml schon an). Frist: launchd wartet nach SIGTERM standardmäßig 20 s bis SIGKILL (Schlüssel ExitTimeOut); die 8 s plus 2 s aus BEENDEN_HOECHSTENS passen. In der plist ExitTimeOut ausdrücklich setzen.",
  "Folge für Windows: nichts, nur neuer cfg-Zweig.",
  "Prüfung: Vorhandene Tests betreiben_nimmt_die_frist_aus_dem_signal (dienst/mod.rs:668-694) und frist_je_stoppart prüfen das Beenden über ein beliebiges Signal und laufen überall. Neu: Test unter cfg(unix), der dem eigenen Prozess SIGTERM schickt und erwartet, dass die Zukunft fertig wird. Ohne Mac: der Zweig ist cfg(unix), also auf Linux (auch WSL) ausführbar; dazu Durchsicht eines Blocks von etwa zehn Zeilen.",
  "Aufwand: klein.",
]

[[block]]
titel = "DB10: Zeitlimit beim Bau: Job-Objekt beendet den ganzen Prozessbaum"
punkte = [
  "Ort: src/bote/bau.rs:43-47 (Beschreibung), :1611 (kill_on_drop), :1613-1615 (anhaengen), :1617-1625 (Abbruch), :1670-1728 (Modul baum mit CreateJobObjectW, SetInformationJobObject, AssignProcessToJobObject, JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE).",
  "Was an Windows hängt: npm und alle Kinder (cmd.exe, vite, esbuild) hängen an einem Job-Objekt; Schließen des Handles beendet den Baum.",
  "Heute außerhalb von Windows: Das Modul baum wird nicht übersetzt; es gibt keinen Ersatz. Nach dem Zeitlimit trifft kind.start_kill (bau.rs:1621) nur den Prozess node mit npm-cli.js. Enkel (vite, esbuild) laufen weiter, halten den halb fertigen Bau-Ordner offen und verbrauchen Rechenzeit.",
  "Schwere: Falsches Verhalten (nur im Fall des Zeitlimits; sonst ohne Wirkung)",
  "Vorschlag für macOS: Kind in eine eigene Prozessgruppe starten (process_group(0) von std und tokio) und nach dem Zeitlimit die ganze Gruppe mit killpg und SIGKILL beenden (libc als Abhängigkeit nur für cfg(unix); steckt über tokio schon im Abhängigkeitsbaum). Ein Gegenstück zu KILL_ON_JOB_CLOSE beim harten Ende des Elternprozesses gibt es unter macOS nicht; das bleibt eine benannte Lücke.",
  "Folge für Windows: nichts, nur neuer cfg-Zweig neben dem Modul baum.",
  "Prüfung: Der vorhandene Test zeitlimit_beendet_den_ganzen_baum (bau.rs:3535-3570) prüft genau das mit einem echten Enkelprozess und ist nicht an Windows gebunden; er würde heute unter macOS rot (Enkel lebt noch) und nach dem Vorschlag grün. Er überspringt sich ohne Node, mit DASHBOARD_TESTS_VOLL nicht. Ohne Mac: derselbe Zweig läuft auf Linux.",
  "Aufwand: klein bis mittel, wegen unsafe für killpg und der Reihenfolge beim Abbruch.",
]

[[block]]
titel = "PC-A1: Datenschutz, Maskierung erkennt nur Windows-Formen von Profilpfaden"
punkte = [
  "Ort: src/datenschutz.rs:1-26 (Kopf, Liste der Formen), 34-37 (Platzhalter), 120-187 (verbergen, json_verbergen, als_json, projekt_verbergen, repo_verbergen), 271-323 (laufwerk), 325-359 (stopp, teil), 404-439 (ProfilForm, profil_teile), 459-522 (pfade_ersetzen), 524-561 (namen_ersetzen)",
  "Was an Windows hängt: pfade_ersetzen sucht ausschließlich nach einem Laufwerk (laufwerk, Zeile 273): X: mit Trennzeichen, \\\\rechner\\c$\\, /c/, /mnt/c/, /cygdrive/c/, jeweils auch URL-kodiert und mit file: davor. Erst nach einem Laufwerk wird Users\\<name> oder Benutzer\\<name> (Zeile 498) oder ein bekanntes Profil gesucht. profil_teile (416-438) nimmt nur Profile mit Laufwerksbuchstaben oder UNC an; ein Profil ohne Laufwerk fällt in Zeile 432-434 heraus (return None). Erkannte Formen heute, vollständig: C:\\Users\\<name>, C:/Users/<name>, Benutzer statt Users, doppelte Trenner, /c/Users/<name>, /mnt/c/Users/<name>, /cygdrive/c/Users/<name>, \\\\rechner\\c$\\Users\\<name>, %5C %2F %3A %24 und doppelt kodiert (%255C ...), file:///C:/Users/<name>, file://rechner/c$/Users/<name>, das bekannte Profil auf Laufwerk oder UNC (auch \\\\?\\ und \\\\.\\), der bekannte Name als ganzes Wort (mindestens 3 Zeichen).",
  "Heute außerhalb von Windows: läuft, tut aber nichts. Nachgerechnet an /Users/name/dev: laufwerk findet an keiner Stelle ein Laufwerk (Zeile 313-314 verlangt einen einzelnen Buchstaben zwischen zwei Trennern), der Text geht unverändert hinaus. Es leckt unter macOS: (1) /Users/<name>/... in jedem Text; (2) /System/Volumes/Data/Users/<name>/...; (3) /Volumes/<Datenträger>/Users/<name> und /Volumes/<Name> selbst (Datenträger heißen oft nach der Person); (4) file:///Users/<name>/... und %2FUsers%2F<name>; (5) /private/var/folders/xx/<kennung>/T/... (Temp-Ordner je Benutzer, kein Name, aber eine feste Kennung des Kontos; std::env::temp_dir liefert das); (6) der Benutzername allein, weil unter macOS kein Name bekannt ist (siehe PC-A2); (7) ~/Library/CloudStorage/OneDrive-<Firma> bzw. GoogleDrive-<Mailadresse>: der Teil nach dem Profil bliebe auch nach einer Maskierung sichtbar (das gilt sinngemäß schon unter Windows). Betroffene Antworten, die durch die Maskierung laufen (Aufrufer gelesen, liegen teils in fremden Scheiben): GET /api/pc frei (src/api/pc.rs:43-46: snapshot, sysapps.errors, data_error), GET /api/pc/verlauf frei (pc.rs:151-152), GET /api/pc/verlauf/voll geschützt (pc.rs:159-165), GET /api/pc/benutzer geschützt (pc.rs:87-90: inventory.root ist unter macOS genau /Users/<name>, inventory.hinweis, autostart.command, winget_error), GET /api/betrieb frei und /api/betrieb/voll geschützt (src/dienst/betrieb.rs:28, 34, 60, 101-103 über speicher::anzeige_pfad), freier und geschützter Live-Kanal SSE (src/api/events.rs:335, 977: PC-Takt mit Laufwerken), /api/projects und /api/projects/<slug> frei (src/api/projekte.rs:33, 36, 42, 49, 74, 149: Check-Adresse und -Fehler, Prozessnamen, Repo-Pfad und Repo-Fehler, Satz kaputter Seiten, Links), /api/projekte/<slug> und Vertragsfehler 422 (src/api/neue_form.rs:72-79, 111), /api/projekte/<slug>/verlauf geschützt (src/api/anstehend.rs:217), /api/meldungen (src/api/meldungen.rs:136-137), ArbeitsFehler (src/api/arbeiten.rs:322), /api/daten (src/api/daten.rs:43, 48, 64, 69 über anzeige_pfad), jeder AppError (src/fehler.rs:122-129), jeder Befund der Prüfung (src/inhalt/pruefung.rs:60-67; geht über /api/pruefung, die Meldung Prüfung rot und die Bauliste hinaus).",
  "Schwere: Falsches Verhalten (Datenschutz-Leck auf freien Wegen)",
  "Vorschlag für macOS: pfade_ersetzen um POSIX-Formen erweitern, als reine Textfunktion und auf allen Plattformen aktiv (kein cfg): an einer Wortgrenze /Users/<name>, /home/<name>, /var/root, mit den Vorsätzen /System/Volumes/Data und /Volumes/<x> (analog zu mnt und cygdrive in Zeile 305), auch kodiert (%2F) und mit file:// davor; neue Variante ProfilForm::Posix(Teile) in profil_teile für ein bekanntes Profil ohne Laufwerk; /private/var/folders/<2>/<kennung> und /var/folders/... auf einen festen Platzhalter. Der Platzhalter %USERPROFILE% bleibt (Vertrag mit web/src/lib/pfade.ts unverändert), der Rest des Pfads behält seine Schrägstriche. Wortgrenze ist Pflicht, damit https://example.org/users/beispiel unverändert bleibt (das verlangt der bestehende Test was_bleibt, src/datenschutz/tests.rs:83-97). /Users/Shared würde mit maskiert (harmlos). Für /Volumes/<Name> in DiskInfo siehe A3.",
  "Folge für Windows: gemeinsamer Code wird erweitert, nicht verzweigt. Unter Windows werden dann auch macOS-Pfade in Texten maskiert (etwa aus einem Repo-Fehler); bestehende Tests müssen unverändert grün bleiben. Kein Vertragswechsel.",
  "Prüfung: neue Einheitstests in src/datenschutz/tests.rs mit erfundenem Konto, laufen unter Windows genauso (reine Textfunktion): je Form ein Fall, dazu Gegenproben (URL mit /users/, /UsersX, /Users allein). Die Tests je Endpunkt in src/datenschutz/endpunkte.rs um POSIX-Texte ergänzen; die Hilfsfunktion ohne_profil (endpunkte.rs:40-52) prüft heute nur :\\users\\ und :/users/ und USERPROFILE, ist unter macOS also blind (api_betrieb, Zeile 138-146, bestünde trotz Leck). Ohne Mac prüfbar: ja, vollständig.",
  "Aufwand: mittel; die Erkennung ist ein handgeschriebener Byte-Scanner mit vielen Grenzfällen, jede neue Form braucht Gegenproben.",
]

[[block]]
titel = "PC-A2: Datenschutz, der Inhaber (Profil und Name) ist außerhalb von Windows unbekannt"
punkte = [
  "Ort: src/datenschutz.rs:80-85 (aus_umgebung liest nur USERPROFILE und USERNAME), 116-118, 579-621 (name_aus_sid, konto_aus_sid mit LookupAccountSidW; Ersatz 618-621); src/oeffnen/mod.rs:597-608 (dienst_einrichten setzt Bekannt aus SID), 614-640 (inhaber_profil, profil_aus_registry; Ersatz 637-640)",
  "Was an Windows hängt: Wer der Inhaber ist, kommt aus den Windows-Variablen USERPROFILE und USERNAME oder, im Dienst, aus der SID über LookupAccountSidW und den Registry-Schlüssel ProfileList\\<SID>\\ProfileImagePath.",
  "Heute außerhalb von Windows: USERPROFILE und USERNAME gibt es unter macOS nicht (dort HOME, USER, LOGNAME), Bekannt ist leer. Im Dienst-Modus liefern konto_aus_sid (datenschutz.rs:619-621) und profil_aus_registry (oeffnen/mod.rs:638-640) None; inhaber_setzen bekommt ein leeres Bekannt. Folge: weder das eigene Profil noch der eigene Name werden je ersetzt, auch nicht als ganzes Wort.",
  "Vorschlag für macOS: aus_umgebung unter cfg(not(windows)): Profil aus HOME, Namen aus USER und LOGNAME, dazu der Ordnername des Profils. Zusätzlich den vollen Namen des Kontos aufnehmen (id -F oder dscl . -read /Users/<kurz> RealName; als feste Kommandos über dienst::programme) und die Rechnernamen (scutil --get ComputerName, LocalHostName), weil macOS den Rechner nach dem Vornamen benennt (siehe PC-A3). Für den Dienst-Modus braucht es einen Ersatz für konten.inhaber_sid: Kurzname oder UID in den Einstellungen, Profil über dscl . -read /Users/<kurz> NFSHomeDirectory oder getpwnam; das hängt am Dienstmodell (Scheibe dienst/einstellungen).",
  "Folge für Windows: nichts, nur neuer cfg-Zweig in aus_umgebung; für den Dienst-Modus ein neues, unter Windows ungenutztes Feld in den Einstellungen (fremde Scheibe).",
  "Prüfung: Bekannt::aus ist schon rein (Zeile 55-71) und unter Windows testbar; neuer Test, dass ein POSIX-Profil (/Users/beispiel) angenommen wird (heute scheitert es später in profil_teile). Die Abfragen dscl/id mit aufgezeichneter Ausgabe als Fixture parsen. Der cfg-Zweig selbst: cargo check --target aarch64-apple-darwin und Durchsicht von etwa zehn Zeilen.",
  "Aufwand: klein für Konsole (HOME, USER); mittel mit Dienst-Modus, weil ein Ersatz für die SID entschieden werden muss.",
]

[[block]]
titel = "PC-A3: PC-Seite, Rechnername und Datenträgernamen gehen frei hinaus"
punkte = [
  "Ort: src/pc/system.rs:482-494 (DiskInfo name und mount aus sysinfo), 498 (host aus System::host_name), 22-23, 117-125; Auslieferung src/api/pc.rs:43-46 und src/api/events.rs:965-977",
  "Was an Windows hängt: Unter Windows sind Rechnername (DESKTOP-...) und Laufwerke (C:\\) unpersönlich. Unter macOS heißt der Rechner standardmäßig nach der Person (Muster <Vorname>s-MacBook-Air), und Datenträger unter /Volumes/<Name> tragen oft Namen.",
  "Heute außerhalb von Windows: sysinfo liefert die Werte; sie laufen durch json_verbergen, das sie nicht erkennt. namen_ersetzen würde <Vorname>s auch mit bekanntem Namen nicht treffen, weil nur ganze Wörter zählen (datenschutz.rs:544-551).",
  "Vorschlag für macOS: Auf dem freien Weg host nicht ausliefern oder durch einen festen Text ersetzen, wenn er einen bekannten Namen als Wortanfang enthält; bei DiskInfo unter macOS mount unter /Volumes/ auf den Platzhalter kürzen und name nur für das Startvolume zeigen. Entscheidung der Maintainer nötig, ob host unter Windows ebenfalls vom freien Weg verschwindet.",
  "Folge für Windows: nichts, wenn die Regel nur für /Volumes/ und den Namensvergleich gilt; ein Vertragswechsel nur, falls host generell entfällt.",
  "Prüfung: Einheitstest auf Snapshot mit erfundenen Werten (host Beispiels-MacBook-Air, mount /Volumes/Beispiel Platte) in src/datenschutz/endpunkte.rs nach dem Muster api_pc (Zeile 55-63); läuft unter Windows.",
  "Aufwand: klein; eine Regel und zwei Tests.",
]

[[block]]
titel = "PC-A4: Zusammenbau-Wächter, Prüfungen entfallen still, weil CARGO_HOME und RUSTUP_HOME nur über USERPROFILE gefunden werden"
punkte = [
  "Ort: src/projekte/zusammenbau.rs:404-416 (DlltoolOrte::aus_umgebung), 494-506 (konfig_orte, Zeile 499), 550-571 (rustup settings.toml, Zeile 551)",
  "Was an Windows hängt: Fehlt CARGO_HOME bzw. RUSTUP_HOME, wird der Ort aus USERPROFILE gebildet (.cargo, .rustup). HOME wird nie gelesen.",
  "Heute außerhalb von Windows: Ohne gesetztes CARGO_HOME ist heim None (499): die Einstellung ~/.cargo/config.toml wird nur geprüft, wenn die Zusammenbau-Kiste zufällig unter dem Benutzerordner liegt (dann trifft die Vorfahren-Schleife in 498 ~/.cargo); liegt der Inhalt woanders (etwa /Volumes/...), bleibt sie ungeprüft. Ohne RUSTUP_HOME ist heim None (551): die Prüfung der rustup-Übersteuerungen (overrides) entfällt ganz, ohne Fund. Der Wächter soll geschlossen scheitern, hier scheitert er offen.",
  "Schwere: Falsches Verhalten (Sicherheitsprüfung mit Lücke)",
  "Vorschlag für macOS: Eine gemeinsame Funktion heim_ordner(): USERPROFILE, sonst HOME (wie schon src/pc/inventory.rs:134); an allen drei Stellen nutzen. Ist weder CARGO_HOME noch ein Heim-Ordner bestimmbar: ein Fund (geschlossen scheitern) statt Schweigen.",
  "Folge für Windows: nichts im Normalfall (USERPROFILE ist gesetzt); neu ist nur der Fund, wenn beides fehlt.",
  "Prüfung: konfig_orte und die rustup-Prüfung so umbauen, dass die Umgebung als Parameter kommt (wie konfig_pruefen_mit, Zeile 449); dann Einheitstests mit erfundener Umgebung, unter Windows lauffähig: nur HOME gesetzt, nichts gesetzt.",
  "Aufwand: klein; drei Stellen, eine Hilfsfunktion.",
]

[[block]]
titel = "PC-A5: Lesefehler-Erkennung hält macOS-Fehlernummern 32 und 33 für eine Dateisperre"
punkte = [
  "Ort: src/inhalt/seite.rs:211-216 (ist_gesperrt), Nutzer 231-239 und src/inhalt/store.rs:532-556",
  "Was an Windows hängt: raw_os_error 32 und 33 sind unter Windows ERROR_SHARING_VIOLATION und ERROR_LOCK_VIOLATION. Unter macOS sind 32 EPIPE und 33 EDOM.",
  "Heute außerhalb von Windows: Ein EPIPE oder EDOM beim Lesen gälte als Sperre (letzter Stand bleibt, Neulesen alle 2 s) statt als Fehler. In der Praxis selten. PermissionDenied (unter macOS auch EPERM durch den Systemschutz TCC bei Dokumente, Schreibtisch, Downloads) gilt auf beiden Systemen als Sperre; unter macOS heißt das: ohne Freigabe wird endlos neu versucht.",
  "Schwere: Falsches Verhalten (gering)",
  "Vorschlag für macOS: Die Nummern 32 und 33 nur unter cfg(windows) zählen; unter macOS EAGAIN/EWOULDBLOCK (35) und EBUSY (16) als Sperre erwägen.",
  "Folge für Windows: nichts, nur cfg um die zwei Zahlen.",
  "Prüfung: Einheitstest mit std::io::Error::from_raw_os_error je Plattform (cfg); ohne Mac: Durchsicht einer Zeile plus cross-check.",
  "Aufwand: klein.",
]

[[block]]
titel = "PC-A6: Link-Adressen, ein Pfad mit / vorn gilt als Weg im Dashboard"
punkte = [
  "Ort: src/inhalt/pruefung.rs:780-800 (ist_link_adresse), Beispiel projects/_vorlage/projekt.toml:23",
  "Was an Windows hängt: Ein lokaler Pfad wird nur als Laufwerkspfad (X:/ oder X:\\, Zeile 795-797) oder file:/// erkannt; alles mit / vorn ist ein Weg im Dashboard (Zeile 799).",
  "Heute außerhalb von Windows: Ein macOS-Pfad /Users/<name>/Projekte/x als url in [[links]] besteht die Prüfung, gilt aber als Dashboard-Weg; die Oberfläche behandelt ihn entsprechend falsch (Oberfläche: fremde Scheibe, web/src/lib/pfade.ts). Mit Leerzeichen im Pfad wird er abgewiesen.",
  "Schwere: Falsches Verhalten (gering)",
  "Vorschlag für macOS: Lokale Pfade unter macOS nur als file:///... zulassen und dokumentieren, oder bekannte Wurzeln (/Users/, /Volumes/, /Applications/) als lokalen Pfad erkennen. Die Vorlage projekt.toml:23 um ein macOS-Beispiel ergänzen.",
  "Folge für Windows: nichts bei der file:-Lösung; bei Wurzel-Erkennung gemeinsamer Code, unter Windows ohne Wirkung.",
  "Prüfung: Einheitstests in pruefung.rs (bestehend 1882-1890), plattformneutral.",
  "Aufwand: klein.",
]

[[block]]
titel = "AN3: Seite „nur in Microsoft Edge“ und Negotiate-Kopfzeile auch außerhalb von Windows"
punkte = [
  "Ort: src/sicherheit.rs:412-441 (anmeldung_fehlt), 443-470 (nach_localhost), Aufruf aus ohne_windows 602-606",
  "Was an Windows hängt: Fehlt die Anmeldung bei einer Navigation, kommt eine Seite mit dem Satz, sie öffne sich nur in Microsoft Edge, andere Browser schickten die Windows-Anmeldung nicht mit, dazu 401 mit WWW-Authenticate: Negotiate.",
  "Heute außerhalb von Windows: ohne_windows ruft dieselbe Funktion. Unter macOS sähe der Inhaber in jedem Browser den Satz zu Edge und zur Windows-Anmeldung; ein Browser, der Negotiate kennt, könnte einen Anmeldedialog zeigen, der nie zum Ziel führt. Der Verweis auf die Anmeldung mit Passkey steht nur klein darunter.",
  "Vorschlag für macOS: Außerhalb von Windows bei fehlender Anmeldung wie passkey_noetig antworten (sicherheit.rs:487-496): Navigation auf /anmelden mit Ziel, alles andere 401 mit Art passkey, ohne Negotiate. Die Seite /anmelden erklärt dort den Einmal-Code.",
  "Folge für Windows: nichts, nur der Zweig in ohne_windows ändert sich.",
  "Prüfung: Vorhanden: schleusen_test.rs:1261-1280 prüft den Wortlaut der Seite (unter macOS heute grün, obwohl der Satz dort falsch ist). Neu: derselbe Test je Plattform mit der erwarteten Antwort; die Entscheidung als reine Funktion (Plattform, Navigation ja oder nein) unter Windows prüfbar.",
  "Aufwand: klein.",
]

[[block]]
titel = "AN4: Schlüssel der Ausweise entsteht außerhalb von Windows ohne enge Rechte"
punkte = [
  "Ort: src/passkey/geheim.rs:1-15 (Beschreibung), 53-117 (Windows: geschützte DACL), 119-127 (andere Plattformen: create_dir_all und OpenOptions ohne Modus); Orte src/app.rs:929-937, src/dienst/einstellungen.rs:331-337",
  "Was an Windows hängt: Unter Windows bekommen Ordner und Datei eine geschützte DACL nur für SYSTEM, Administratoren und das Dienstkonto.",
  "Heute außerhalb von Windows: Datei und Ordner entstehen mit den Rechten aus der umask, üblich 0644 und 0755. Andere Konten am selben Rechner können den Schlüssel lesen, wenn sie in den Ordner kommen; damit ließe sich ein Ausweis schreiben.",
  "Vorschlag für macOS: Schlüssel in den Schlüsselbund (wie AN1). Solange es eine Datei bleibt: Datei 0600, Ordner 0700, und beim Laden Eigentümer und Rechte prüfen; ein zu offener Schlüssel wird abgelehnt.",
  "Folge für Windows: nichts.",
  "Prüfung: Vorhanden: wird_angelegt_und_beim_zweiten_mal_gelesen (geheim.rs:181-204) prüft die DACL nur unter Windows. Neu: derselbe Test unter cfg(unix) mit Prüfung des Modus; läuft auf Linux, also ohne Mac.",
  "Aufwand: klein.",
]

[[block]]
titel = "AN8: Anzeige von Pfaden als %USERPROFILE%"
punkte = [
  "Ort: src/speicher/mod.rs:334-349 (anzeige_pfad liest nur USERPROFILE), Tests 489-505; Nutzer src/dienst/betrieb.rs:28, 34, 60, 101-103, src/api/daten.rs:43, 48, 64, 69",
  "Was an Windows hängt: Pfade im Benutzerordner werden vor dem Ausliefern gekürzt und mit %USERPROFILE% begonnen.",
  "Heute außerhalb von Windows: USERPROFILE ist unter macOS nicht gesetzt; die Funktion kürzt nichts. Der volle Pfad mit dem Kontonamen geht hinaus, auch auf dem freien Weg /api/betrieb, wenn die Schwärzung ihn nicht erkennt (siehe PC-A1 und PC-A2).",
  "Vorschlag für macOS: Heim-Ordner aus USERPROFILE, sonst HOME, über dieselbe Hilfsfunktion wie bei PC-A4. Der Platzhalter kann bleiben (die Oberfläche kennt ihn), der Rest des Pfads behält seine Schrägstriche.",
  "Folge für Windows: nichts.",
  "Prüfung: anzeige_pfad_mit ist schon rein (Zeile 489-499); neuer Fall mit einem Pfad ohne Laufwerk, läuft unter Windows.",
  "Aufwand: klein.",
]

