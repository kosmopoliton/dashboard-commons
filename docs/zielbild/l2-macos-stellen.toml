[[block]]
titel = "Sperre (2)"
text = "Ohne diese Stellen baut das Programm unter macOS nicht, oder es ist dort nicht nutzbar."

[[block]]
titel = "AN1: Verschlüsselung der Aufgaben-Links (DPAPI), der Bau bricht mit Absicht ab"
punkte = [
  "Ort: src/speicher/verschluesselung.rs:1-25 (Begründung und ENTROPIE), 27-28 (compile_error), 31-121 (DPAPI, nur Windows), 124-135 (Ersatz nur für Tests); Aufrufer src/speicher/aufgaben.rs:268-296 (link_fuer), 409-414 (aufgabe_anlegen), src/speicher/migration.rs:619, 711, 797 (Tests)",
  "Was an Windows hängt: Die Links der Aufgaben werden mit CryptProtectData und CryptUnprotectData unter dem Konto des Servers verschlüsselt. Außerhalb von Windows steht eine Sperre im Quelltext.",
  "Heute außerhalb von Windows: cargo build und cargo check brechen ab (Zeile 27-28). Nur cargo test für die Bibliothek übersetzt, mit einem Ersatz, der nicht verschlüsselt (Zeile 124-135). Die Integrationstests in tests/ binden die Bibliothek ohne den Ersatz und übersetzen darum auch nicht.",
  "Vorschlag für macOS: Schlüsselbund von macOS, ohne eigenes Verfahren: je Link ein Eintrag, hinter einer kleinen Schnittstelle Linkablage (ablegen, lesen, loeschen). Im Einzelnen im Abschnitt „macOS: die zwei Sicherheitsteile“, Teil 1.",
  "Folge für Windows: Verhalten gleich, DPAPI bleibt. Gemeinsamer Code wird umgebaut: aufgabe_anlegen und link_fuer rufen die Schnittstelle; das Ablegen kommt nach dem Vergeben der Kennung.",
  "Prüfung: Vorhanden: hin_und_zurueck (verschluesselung.rs:142-150), die Zählung der Entschlüsselungen (aufgaben.rs:1062-1082, src/api/anstehend.rs:479-482). Neu: Tests der Schnittstelle mit einer Ablage im Arbeitsspeicher, laufen unter Windows. Ohne Mac: cargo check für das Apple-Ziel wird mit diesem Schritt zum ersten Mal grün; der Zugriff auf den Schlüsselbund selbst nur am Mac oder auf einem macOS-Läufer.",
  "Aufwand: mittel, wegen des Umbaus der zwei Aufrufer und der Reihenfolge von Ablage und Datenspeicher.",
]

[[block]]
titel = "AN2: Anmeldung als Inhaber gibt es nur über das Windows-Konto"
punkte = [
  "Ort: src/sicherheit.rs:524-571 (anmeldung_pflicht), 588-609 (ohne_windows), 611-730 (anmeldung_windows); src/anmeldung/mod.rs:10-15 (aushandlung und sspi nur Windows), 26-56 (Inhaber, WindowsKonto), 94-97 (ist_inhaber); src/anmeldung/sspi.rs:1-340 und src/anmeldung/aushandlung.rs (ganz, nur Windows); src/anmeldung/verbindung.rs:59-62 (Vorrat der Verbindungen nur Windows); src/api/passkey.rs:58-61 (konto_noetig), 301-303 (konto_aus), 307-320, 369-452 (Antrag); src/api/anmeldung.rs:84, 135-170 (Probe, außerhalb von Windows 501)",
  "Was an Windows hängt: Als Inhaber gilt, wer sich über die integrierte Windows-Anmeldung (Negotiate über SSPI) mit der SID des Inhabers ausweist, oder wer einen Ausweis nach Anmeldung mit Passkey vorzeigt. Der erste Passkey entsteht nur über die Windows-Anmeldung.",
  "Heute außerhalb von Windows: ohne_windows lässt nur einen gültigen Ausweis durch. Der Antrag auf einen Passkey verlangt ein Windows-Konto, das dort nie entsteht (konto_aus liefert anmeldung_noetig). Es kann also kein erster Passkey entstehen; alle geschützten Wege bleiben bei 401. Das Programm liefe, wäre aber nur in seinen freien Teilen nutzbar.",
  "Vorschlag für macOS: Lokaler Kanal (Unix-Socket, der Kern bezeugt das Konto der Gegenseite) als Hauptkonto für alles ohne Browser, dazu ein Einmal-Code für den ersten Passkey im Browser. Im Einzelnen im Abschnitt „macOS: die zwei Sicherheitsteile“, Teil 2.",
  "Folge für Windows: Verhalten gleich. Gemeinsamer Code wird verallgemeinert: Die Erweiterung WindowsKonto und die Art Hauptkonto bekommen eine plattformneutrale Quelle.",
  "Prüfung: Vorhanden: src/schleusen_test.rs (Schleusen), die Tests in src/api/passkey.rs ab Zeile 534 (heute nur Windows, siehe AN9). Neu: Tests für Code (einmal, Ablauf, Fehlversuche) und für die Prüfung des Kontos als reine Funktionen, laufen unter Windows; der Socket selbst unter cfg(unix), also auch auf Linux.",
  "Aufwand: gross, weil es den Kern der Anmeldung berührt und eine Entscheidung zur Sache braucht.",
]

