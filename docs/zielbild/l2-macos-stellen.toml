  "Prüfung: Parser für InstallHistory.plist, launchctl list und last reboot mit Fixtures, unter Windows lauffähig; die reinen Funktionen in ereignisse.rs sind schon getestet (228-326).",
  "Aufwand: mittel bis groß; drei Quellen, andere Begriffe, Abstimmung mit dem Verlauf.",
]

