[[block]]
titel = "DB16: Standardorte und Umgebungsvariablen in Windows-Form"
punkte = [
  "Ort: (a) src/bote/mod.rs:27-29, :53-76 und src/bin/dashboard-bote.rs:21, :206-229: Ersatz-Protokollordner aus LOCALAPPDATA\\Dashboard\\protokoll. (b) src/app.rs:919-927: Datenspeicher aus USERPROFILE, Rückfall HOME, dann .var/dashboard/dashboard.redb; :929-937 geheim/jwt-schluessel daneben; gleiches Muster in src/pc/inventory.rs:133-140 (andere Scheibe; Kontext.profil in src/bote/aufgaben.rs:64). (c) src/app.rs:897-905: Kopie der Oberfläche in web neben dem Programm (bin\\web). (d) src/dienst/mod.rs:536-539: Ersatz-Protokoll neben der Einstellungsdatei, im Kommentar C:/ProgramData/Dashboard/protokoll. (e) src/app.rs:513-519 und src/dienst/betrieb.rs:4: Anzeige von Pfaden als %USERPROFILE%\\... (Funktion speicher::anzeige_pfad, andere Scheibe). (f) Kommentare mit C:/ProgramData/Dashboard als Ort von dienst.toml, daten, sicherung, protokoll, geheim, bin: src/dienst/einstellungen.rs:3, :332.",
  "Was an Windows hängt: Erwartete Orte folgen dem Windows-Aufbau ProgramData für den Dienst und LOCALAPPDATA für den Benutzer; das Profil kommt zuerst aus USERPROFILE.",
  "Heute außerhalb von Windows: (a) LOCALAPPDATA ist nicht gesetzt, ersatz_protokoll liefert None (bote/mod.rs:74-76); es gibt dann keinen Ersatzordner, das Protokoll bleibt beim gewollten Ordner oder in der Konsole (mod.rs:67-69). (b) funktioniert schon über HOME: ~/.var/dashboard/dashboard.redb, ~/.var/dashboard/geheim/jwt-schluessel, ~/.cache/dashboard/folders.json. (c), (d) neutral, funktionieren. (e) zeigt unter macOS vermutlich %USERPROFILE% vor einem macOS-Pfad (in anderer Scheibe zu klären). (f) nur Dokumentation.",
  "Vorschlag für macOS: Für den Betrieb mit Einstellungsdatei unter macOS einen Standardbaum festlegen. Folgerichtig zum vorhandenen Code ist ~/.var/dashboard (der Code nutzt diesen Ort schon als Rückfall, und jwt_schluessel_datei in einstellungen.rs:334-337 legt geheim neben den Ordner daten): ~/.var/dashboard/dienst.toml, daten/dashboard.redb, sicherung, protokoll, geheim, bin, bin/web. macOS-üblich wäre ~/Library/Application Support/Dashboard für Daten und ~/Library/Logs/Dashboard für Protokolle; das wäre ein zweiter Ort neben dem schon vorhandenen ~/.var/dashboard des Modus Umgebung. Empfehlung: ~/.var/dashboard, weil ein Ort für beide Startarten, und Library nur für die plist (~/Library/LaunchAgents). Ordner mit Modus 0700, Dateien 0600 (geheim und Datenspeicher; die Schlüsseldatei selbst liegt in src/passkey/geheim, andere Scheibe). Zu (a): entfällt, wenn der Bote unter macOS im eigenen Prozess läuft (DB01); sonst Rückfall auf HOME/Library/Logs/Dashboard in ersatz_protokoll.",
  "Folge für Windows: nichts; neue Standardwerte nur in einem cfg-Zweig und im macOS-Einrichtungsskript.",
  "Prüfung: Vorhanden: jwt_schluessel_neben_dem_datenordner und inventar_neben_dem_datenspeicher (einstellungen.rs:522-540). Neu: Test der Funktion standard_ordner(plattform, heim). Ohne Mac als reine Funktion prüfbar.",
  "Aufwand: klein.",
]

