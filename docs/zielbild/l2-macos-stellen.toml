  "Prüfung: inhaber_meldung ist rein (567-575) und getestet; neue Texte per Einheitstest.",
  "Aufwand: klein, sobald PC-A2 entschieden ist.",
]

[[block]]
titel = "AN5: Tresor der Seite Schlüssel (Anmeldeinformationsverwaltung von Windows)"
punkte = [
  "Ort: src/schluessel.rs:1-17 (Beschreibung, TARGET_PREFIX, MAX_SECRET_CHARS), 169-322 (CredReadW, CredWriteW, CredDeleteW, nur Windows), 324-335 (Ersatz); src/api/schluessel.rs (Seite und Wache des Tresors, Tests 366, 437 nur Windows); src/bote/aufgaben.rs:320-343 (TresorInfo, TresorSchreiben)",
  "Was an Windows hängt: Passwörter, die der Inhaber auf der Seite Schlüssel eingibt, landen als Eintrag ranke/<name> in der Anmeldeinformationsverwaltung. Das Dashboard zeigt nie einen Wert.",
  "Heute außerhalb von Windows: cred_info liefert nichts, cred_write einen Fehler, cred_delete tut nichts (schluessel.rs:324-335). Die Seite zeigt alle Schlüssel als fehlend; Speichern scheitert.",
  "Vorschlag für macOS: Schlüsselbund von macOS: ein Eintrag je Name unter einem festen Dienstnamen, dieselbe Regel (nie einen Wert zurückgeben, nur fehlt oder gespeichert am). Die Grenze von 1200 Zeichen ist eine Grenze von Windows und kann bleiben. Das Lesen durch die Chats (heute Schluessel-Lesen.ps1) braucht ein Gegenstück, am besten als Unterbefehl des Programms.",
  "Folge für Windows: nichts, nur neuer cfg-Zweig neben dem Ersatz.",
  "Prüfung: Vorhanden: Tests der Seite mit dem Ersatz laufen überall; die zwei Tests gegen den echten Tresor nur unter Windows. Neu: dieselben zwei unter cfg(target_os = \"macos\") mit eigenem Dienstnamen für Tests. Ohne Mac nur Durchsicht und cargo check für das Ziel.",
  "Aufwand: mittel.",
]

[[block]]
titel = "AN6: Werkzeuge ohne Browser können sich außerhalb von Windows nicht ausweisen"
punkte = [
  "Ort: src/sicherheit.rs:136-182 (herkunft_pflicht mit der Liste der Chat-Wege 145-148), 321-362 (dieselben Wege sind geschützt); src/herzschlag/abfrage.rs:123-155 (holen mit Negotiate, außerhalb von Windows ein Fehler); Aufrufer scripts/Api.ps1, scripts/Anfrage.ps1, scripts/Warten.ps1",
  "Was an Windows hängt: Chats und der Stop-Hook rufen die API ohne Browser und weisen sich mit der Windows-Anmeldung des Kontos aus.",
  "Heute außerhalb von Windows: Die Herkunftsprüfung ließe sie durch, die Anmeldung nicht: Ohne Cookie gibt es 401. Der Stop-Hook bekommt außerhalb von Windows einen Fehler und lässt jedes Ende zu (er versagt offen, wie vorgesehen); die Chats erreichen Vorgänge, Aufgaben, Arbeiten und Meldungen nicht.",
  "Vorschlag für macOS: Der lokale Kanal aus AN2: ein Aufruf über den Unix-Socket gilt als Hauptkonto. Als Aufrufer ein Unterbefehl des Programms statt PowerShell (etwa dashboard api und dashboard warten), plattformneutral und in Rust prüfbar. Der geplante eigene Schlüssel je Chat lässt sich darauf aufsetzen.",
  "Folge für Windows: nichts, wenn die Skripte bleiben; die Unterbefehle könnten unter Windows später dieselben Skripte ablösen.",
  "Prüfung: Neu: Tests der Unterbefehle gegen einen Testserver am Socket unter cfg(unix), also auch auf Linux. Vorhanden: tests/herzschlag.rs (vier Tests ohne Sperre).",
  "Aufwand: mittel, hängt an AN2.",
]

