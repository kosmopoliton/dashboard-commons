  "Was an Windows hängt: Im Dienst-Modus (mit Einstellungsdatei) kommt das Profil des Inhabers nur über seine SID aus der Registry; fehlt es, meldet der Dienst eine Störung.",
  "Heute außerhalb von Windows: Mit Einstellungsdatei ist das Profil immer None (profil_aus_registry-Ersatz 637-640): dauerhafte Fehlermeldung inhaber-fehlt mit Windows-Text, kein Ort geht auf, die Prüfung der Orte lässt die Lage weg (pruefung.rs:653-655, 666).",
  "Vorschlag für macOS: wie PC-A2 (Inhaber über Kurzname oder UID, Profil über dscl oder getpwnam); Texte je Plattform.",
