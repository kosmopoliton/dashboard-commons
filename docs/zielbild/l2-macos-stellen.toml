  "Vorschlag für macOS: Programmnamen ohne Endung schreiben (dashboard, dashboard-bote), Pfade in Sätzen mit Schrägstrich oder über Path::display. Die Hinweise auf Dienst.ps1 -Neustart und Start-Dashboard.ps1 über eine kleine Funktion neustart_hinweis() je Plattform liefern (unter macOS der Name des dortigen Einrichtungsskripts oder launchctl kickstart).",
