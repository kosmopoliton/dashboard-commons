[[block]]
titel = "PC-B5: PC-Seite, Virenschutz (Defender über PowerShell)"
punkte = [
  "Ort: src/pc/system.rs:235-351 (Typen und Regel), 419-432, 548-561 (DEFENDER_SCRIPT), 563-620 (Abfrage; Abzweig 574-577), 622-637",
  "Was an Windows hängt: Get-MpComputerStatus über Windows PowerShell aus System32.",
  "Heute außerhalb von Windows: error = nur unter Windows (575), nach bewerten: befund unbekannt, gruende abfrage-fehlgeschlagen (324-325).",
  "Vorschlag für macOS: Eigener Sammler mit festen Kommandos: Gatekeeper spctl --status, XProtect-Fassung aus /Library/Apple/System/Library/CoreServices/XProtect.bundle/Contents/Info.plist (Fassung und Änderungszeit als Signaturstand), FileVault fdesetup status, optional Firewall /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate und csrutil status. Abbildung auf DefenderStatus: antivirus_enabled aus Gatekeeper, realtime_enabled aus XProtect vorhanden, signature_version und signature_age_days aus XProtect; dazu ein Feld, das die Art nennt (defender oder xprotect), damit die Oberfläche richtig beschriftet. Die Schwelle 3 Tage (SIGNATUR_SCHWELLE_TAGE, 239) passt nicht zu XProtect (Updates seltener) und braucht einen eigenen Wert.",
  "Folge für Windows: ein zusätzliches Feld im Vertrag (Art des Schutzes), sonst nichts; bewerten bleibt gemeinsam.",
  "Prüfung: bewerten ist rein und getestet. Neue Parser (spctl, fdesetup, Info.plist) mit aufgezeichneten Ausgaben als Fixtures, unter Windows lauffähig; echte Abfrage nur auf macOS-Runner.",
  "Aufwand: mittel; drei bis vier Parser, eine Vertragsentscheidung.",
]

[[block]]
titel = "PC-B6: PC-Seite, Dienste, Hotfixes, Startzeiten und Update-Ereignisse über PowerShell"
punkte = [
