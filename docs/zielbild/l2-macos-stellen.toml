  "Was an Windows hängt: Ein PowerShell-Skript liest Dienste, installierte Hotfixes und zwei Arten aus der Windows-Ereignisanzeige.",
  "Heute außerhalb von Windows: run scheitert mit powershell nicht gefunden (nur an festen Orten gesucht, nicht im PATH); der Satz steht in errors und lokal_fehler (324-326) und damit auf /api/pc. services_running leer, services_total 0, keine Ereignisse für den Verlauf.",
  "Vorschlag für macOS: Eigener Sammler: Dienste aus launchctl list (Benutzer) und launchctl print system; Updates und Installationen aus /Library/Receipts/InstallHistory.plist (Datum, Name, Fassung; ohne Root lesbar) oder softwareupdate --history; Startzeiten: sysctl kern.boottime (nur der laufende Start) und last reboot (begrenzte Rückschau); eine 90-Tage-Geschichte wie aus der Ereignisanzeige gibt es nicht verlässlich, das ehrlich als Hinweis im Verlauf sagen. ereignisse.rs bekommt einen zweiten Eingang ohne KB-Logik.",
