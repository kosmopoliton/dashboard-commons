[[block]]
titel = "Die Grundentscheidung: ein Konto, kein Bote"
punkte = [
  "Entschieden: Unter macOS läuft der Server zunächst im Konto des Inhabers, von launchd gestartet, ohne Boten. Er sieht Profil, Schlüsselbund, Werkzeuge und Repos selbst. Die Aufgaben des Boten laufen im selben Prozess; der Code dafür ist schon plattformneutral und wird vom Modus --einmal genau so benutzt (DB01).",
  "Die Grenze: Jedes Programm dieses Kontos ist dort der Inhaber, auch für die Links. Der Schlüsselbund schützt Kopien, Sicherungen und andere Konten, nicht gegen Programme desselben Kontos. Das gehört so in die Anleitung.",
  "Es entfallen unter macOS: Pipe und Prüfung des Gegenübers (DB02), der Wächter des Boten (DB11), die Abfrage der Sitzung (PC-B11), die Prüfung der Leserechte des Dienstkontos (PC-B12).",
  "Ein getrenntes Konto für den Server bleibt eine spätere, eigene Entscheidung und ist nicht Teil der zwölf Schritte.",
]

[[block]]
titel = "Entschieden"
text = """
Eure Antworten auf unsere Fragen, damit sie an einer Stelle stehen."""

[[block]]
nummeriert = true
punkte = [
  "Ein Konto, kein Bote: ja, zunächst.",
  "Schlüsselbund: ja, mit der Mischform für die Links. Eine feste lokale Signatur durch das Einrichtungsskript ist in Ordnung.",
  "Lokaler Kanal und Einmal-Code: ja, mit den Bedingungen im Abschnitt zu den Sicherheitsteilen. Der Kanal gilt als Hauptkonto. Ein Code darf auch weitere eigene Passkeys anlegen. Für die Chats ist der Kanal nur der Transport.",
  "Wege fürs Hauptkonto: Unter macOS genügt eine frische Anmeldung mit Passkey, höchstens 5 Minuten.",
  "Andere Konten am selben Mac: zunächst kein Passkey; die Oberfläche sagt es.",
  "Unterbefehle: unter macOS ja; unter Windows bleiben vorerst die Skripte.",
  "Rechnername auf dem freien Weg: weglassen oder ersetzen, auf allen Plattformen, als eigener kleiner Schritt.",
  "Orte: Library/Application Support/dashboard für Daten, Library/Caches/dashboard für Bauten, Library/Logs/dashboard für Protokolle, jeweils im Benutzerordner. Geheimes nie dort.",
  "Node: eine freiwillige Variable mit vollem Pfad, beim Start geprüft, ohne Suche im PATH.",
  "Öffnen: eine feste Liste je Endung, wie unter Windows.",
  "Nachweis vom Mac: ein Lauf auf einem macOS-Runner in unserem Fork, mit eurer Workflow-Datei (nur von Hand gestartet, Commit als Eingabe). Ihr prüft den Lauf am Commit und die Datei per Hash. Ein Protokoll ist willkommen, aber kein Beleg. Läufe unter Linux gibt es auf eurer Seite nicht.",
  "Autor und Committer mit der noreply-Adresse unseres Kontos, keine Signatur, keine Commits oder Merges über die Oberfläche der Plattform.",
]

[[block]]
titel = "Ablauf"
nummeriert = true
punkte = [
  "Wir bauen je Schritt auf einem Zweig ab main (nie ab studie-macos), halten ihn per Merge aktuell und nennen im Issue: Zweig, Commit, die Nummer des Laufs auf dem Runner und die berührten gemeinsamen Dateien mit ihrem Windows-Test.",
  "Ihr prüft: den Diff vor jedem Bau, neue Abhängigkeiten nur nach Absprache, den vollen Prüfweg unter Windows mit Vergleich der Testnamen, die Übersetzung für den Mac und den Lauf am Commit. Das Urteil steht im Issue.",
  "Nach dem Ja übernehmt ihr den Stand per Merge-Commit; die nächste Fassung nimmt ihn mit.",
  "Es ist immer nur ein Angebot offen; der nächste Schritt beginnt nach dem Merge.",
  "Vorher auf eurer Seite: Der Prüfer lernt fremde Autoren und Heimatpfade von macOS und Linux, die Übersetzung für den Mac läuft bei euch als Probe, wir bekommen die Workflow-Datei, der Leitfaden bekommt einen Abschnitt für Zweige mit mehreren Übernahmen.",
]

[[block]]
titel = "Reihenfolge der Schritte"
text = """
Nach eurem Schnitt. Jeder Schritt läuft für sich, lässt sich mit git revert zurücknehmen und ändert das Verhalten unter Windows nicht, außer wo es eigens steht. Ab Schritt 3 gehört zu jedem Angebot ein Lauf auf dem Runner; ab Schritt 4 ist die Übersetzung für den Mac Pflicht."""

