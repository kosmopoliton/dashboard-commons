[[block]]
titel = "Das Ergebnis in sieben Sätzen"
nummeriert = true
punkte = [
  "Zwei Stellen sperren: Der Bau bricht außerhalb von Windows mit Absicht ab (Verschlüsselung der Aufgaben-Links), und niemand kann sich dort als Inhaber anmelden (der erste Passkey braucht ein Windows-Konto).",
  "Der übrige Code ist sauber abgegrenzt: Jede Stelle nur für Windows hat einen Zweig für andere Plattformen. Wir zählen 68 Stellen, davon 14 mit falschem Verhalten unter macOS und 24 mit fehlender Funktion.",
  "Die wichtigste Gruppe beim falschen Verhalten ist der Datenschutz: Das Schwärzen von Pfaden und Namen kennt nur Windows-Formen, im Server wie in der Oberfläche. Das kommt zuerst.",
  "Unter macOS läuft der Server zunächst im Konto des Inhabers, ohne Boten. Jedes Programm dieses Kontos ist dort der Inhaber.",
  "Geheimnisse liegen im Schlüsselbund von macOS: der Schlüssel für die Aufgaben-Links (Mischform), der Schlüssel der Ausweise und der Tresor der Seite Schlüssel. Nichts Geheimes liegt im Datenordner.",
  "Die Anmeldung geht über einen lokalen Kanal, an dem der Kern das Konto der Gegenseite bezeugt, und über einen Einmal-Code für Passkeys im Browser.",
  "Jeder Schritt ist so geschnitten, dass ihr den Diff lest, den vollen Prüfweg unter Windows fahrt und für den Mac die Übersetzung und einen Lauf auf dem Runner am Commit seht.",
]

