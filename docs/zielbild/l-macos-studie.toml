titel = "macOS: Studie zur Portierung"
reihenfolge = 14
text = """
Diese Studie beantwortet die Bitte aus dem Issue zum Betrieb unter macOS: was am Backend an Windows hängt, was wir für macOS vorschlagen, was sich dadurch für Windows ändert, wie sich jeder Schritt prüfen lässt und in welcher Reihenfolge kleine Schritte dorthin führen. Sie ist ein Vorschlag zur Entscheidung, kein Beschluss, und liegt auf einem eigenen Zweig, der nicht zum Übernehmen angeboten wird.

Sie besteht aus vier Abschnitten: diesem Überblick mit der Reihenfolge, der vollständigen Liste der Stellen („macOS: alle Stellen, die an Windows hängen“), den zwei Sicherheitsteilen („macOS: die zwei Sicherheitsteile“) und den Prüfwegen („macOS: prüfen, auch ohne Mac“).

Stand: dabe5d1, Fassung 0.3.0. Alles ist gelesen, nichts gebaut und nichts ausgeführt. Was sich nur am Gerät klären lässt, steht in jedem Abschnitt unter „Offen“."""

[[block]]
titel = "Das Ergebnis in sieben Sätzen"
nummeriert = true
punkte = [
  "Zwei Stellen sperren: Der Bau bricht außerhalb von Windows mit Absicht ab (Verschlüsselung der Aufgaben-Links), und niemand kann sich dort als Inhaber anmelden (der erste Passkey braucht ein Windows-Konto).",
  "Der übrige Code ist sauber abgegrenzt: Jede Stelle nur für Windows hat einen Zweig für andere Plattformen. Wir haben 67 Stellen gezählt, davon 13 mit falschem Verhalten unter macOS und 24 mit fehlender Funktion.",
  "Die wichtigste Gruppe beim falschen Verhalten ist der Datenschutz: Das Schwärzen von Pfaden und Namen kennt nur Windows-Formen. Unter macOS gingen Heimatpfad, Kontoname und Rechnername auf den freien Wegen hinaus. Das muss vor allem anderen stimmen.",
  "Die Grundentscheidung: Unter macOS läuft der Server im Konto des Inhabers, von launchd gestartet. Dann braucht es keinen Boten, keine Pipe und kein zweites Konto; mehrere Stellen entfallen. Der Preis ist, dass die Trennung von Dienstkonto und Inhaberkonto wegfällt.",
  "Für Geheimnisse schlagen wir den Schlüsselbund von macOS vor, ohne eigenes Verfahren: für die Aufgaben-Links, den Schlüssel der Ausweise und den Tresor der Seite Schlüssel.",
  "Für die Anmeldung schlagen wir einen lokalen Kanal vor, an dem der Kern das Konto der Gegenseite bezeugt, und einen Einmal-Code für den ersten Passkey im Browser.",
  "Fast alles lässt sich so bauen, dass ihr es unter Windows prüfen könnt: Typprüfung für das Apple-Ziel, Entscheidungen als reine Funktionen mit Tests, Unix-Zweige unter Linux. Nur ein dünner Rest braucht einen Mac.",
]

