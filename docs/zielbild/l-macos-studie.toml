titel = "macOS: Studie zur Portierung"
reihenfolge = 14
text = """
Diese Studie beantwortet die Bitte aus dem Issue zum Betrieb unter macOS: was am Backend an Windows hängt, was wir für macOS vorschlagen, was sich dadurch für Windows ändert, wie sich jeder Schritt prüfen lässt und in welcher Reihenfolge kleine Schritte dorthin führen. Sie liegt auf einem eigenen Zweig, der nicht zum Übernehmen angeboten wird.

Fassung 2. Sie nimmt eure Prüfung der ersten Fassung und eure Antworten auf unsere zwölf Fragen auf; was sich geändert hat, steht im nächsten Block. Sie besteht aus vier Abschnitten: diesem Überblick, der vollständigen Liste der Stellen („macOS: alle Stellen, die an Windows hängen“), den zwei Sicherheitsteilen („macOS: die zwei Sicherheitsteile“) und den Prüfwegen („macOS: prüfen, auch ohne Mac“).

Stand: dabe5d1, Fassung 0.3.0. Der Quelltext ist gelesen, nicht gebaut und nicht ausgeführt. Neu in Fassung 2: eine Messung am Gerät zum Schlüsselbund, mit einem eigenen kleinen Programm, nicht mit dem Dashboard."""

