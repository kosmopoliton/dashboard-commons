[[block]]
titel = "Was diese Studie nicht leistet"
punkte = [
  "Nichts ist gebaut oder ausgeführt. Jede Aussage zum Verhalten unter macOS ist aus dem Code abgeleitet. Ob das Programm nach Schritt 4 wirklich übersetzt und welche Tests rot sind, zeigt erst der erste Lauf.",
  "Zeilenangaben gelten für den Stand dabe5d1.",
  "Die Oberfläche ist nur gesichtet.",
  "Aussagen über macOS selbst (launchd, Schlüsselbund, das Systemwerkzeug zum Öffnen, Fristen beim Herunterfahren, Safari) stammen aus Kenntnis und sind am Gerät zu bestätigen. Die offenen Punkte stehen in jedem Abschnitt.",
  "Aufwand ist je Stelle als klein, mittel oder gross geschätzt, nicht in Tagen.",
]
