[[block]]
titel = "Die Grundentscheidung: ein Konto, kein Bote"
punkte = [
  "Unter Windows läuft der Dienst unter einem eigenen Konto und sieht das Profil des Inhabers nicht. Darum gibt es den Boten im Konto des Inhabers, die Pipe dazwischen, die Prüfung des Gegenübers und den Wächter.",
  "Unter macOS schlagen wir vor: Der Server läuft als Agent von launchd im Konto des Inhabers. Er sieht Profil, Schlüsselbund, Werkzeuge und Repos selbst. Die Aufgaben des Boten laufen im selben Prozess; der Code dafür ist schon plattformneutral und wird vom Modus --einmal genau so benutzt (DB01).",
  "Damit entfallen unter macOS: Pipe und Prüfung des Gegenübers (DB02), der Wächter (DB11), die Abfrage der Sitzung (PC-B11), die Prüfung der Leserechte des Dienstkontos (PC-B12).",
  "Was dabei verloren geht: Ein Programm im Konto des Inhabers kann die Dateien des Servers lesen. Der Schlüsselbund fängt das für die Geheimnisse auf (macOS fragt, bevor ein anderes Programm einen Eintrag liest); für den Datenspeicher selbst nicht.",
  "Die Alternative mit getrenntem Konto (Server als Daemon unter eigenem Systemkonto, dazu ein Bote über einen Unix-Socket) ist möglich und in DB02 skizziert. Sie ist der große Umbau. Wir schlagen sie nicht für den ersten Weg vor und stellen sie als späte, eigene Entscheidung ans Ende.",
]

[[block]]
titel = "Reihenfolge kleiner Schritte"
text = """
Jeder Schritt läuft für sich, lässt sich mit git revert zurücknehmen und ändert das Verhalten unter Windows nicht, außer wo es eigens steht. Die Schritte 1 und 2 brauchen keinen Mac und könnten sofort beginnen."""

