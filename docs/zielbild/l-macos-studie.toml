[[block]]
titel = "Was sich für Windows ändert"
punkte = [
  "Das Verhalten soll in keinem Schritt anders werden. Wo gemeinsamer Code umgebaut wird, steht es bei der Stelle unter „Folge für Windows“.",
  "Die vier größten Eingriffe in gemeinsamen Code: die Schnittstelle Linkablage in src/speicher/aufgaben.rs (AN1); die zweite Ausführung des Boten in src/bote/client.rs (DB01); die plattformneutrale Quelle für das Hauptkonto in src/sicherheit.rs und src/anmeldung/mod.rs (AN2); das Pfadmodell in src/oeffnen (PC-B1).",
  "Unter Windows werden nach Schritt 1 auch Pfade in den Formen von macOS geschwärzt, falls sie in einem Text vorkommen. Das ist gewollt.",
  "Einige Sätze verlieren die Endung .exe (DB18). Tests, die den Wortlaut prüfen, ziehen mit.",
  "Maßstab je Schritt: cargo test und npm run verify unter Windows melden vorher und nachher dieselbe Zahl grüner Tests oder mehr.",
]

