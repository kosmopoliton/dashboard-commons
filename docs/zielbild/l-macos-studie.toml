[[block]]
text = """
Zehn Stellen der Liste hat keine Suche gefunden, weil in der Zeile kein Windows-Wort steht: das fehlende SIGTERM, der Trenner im PATH, der Standardwert in dienst.toml, Rechner- und Plattennamen auf dem freien Weg, der fehlende Rückfall auf HOME im Wächter, die Fehlernummern 32 und 33, ein Pfad mit Schrägstrich als Weg im Dashboard, die Dateien des Finders im Wächter, die Seite „nur in Microsoft Edge“ und die Rechte der Schlüsseldatei. Es kann weitere solche Stellen geben; ein Lauf am Gerät wird sie zeigen."""

