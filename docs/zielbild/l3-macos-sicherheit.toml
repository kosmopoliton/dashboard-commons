  ["Wer kann die Aufgaben-Links lesen?", "Nur das Dienstkonto auf diesem PC (DPAPI, src/speicher/verschluesselung.rs). Eine kopierte Datei hilft niemandem, auch nicht dem Konto des Inhabers.", "Es gibt keine Entsprechung im Quelltext; der Bau bricht mit Absicht ab (Zeile 27)."],
  ["Wer kann den Schlüssel der Ausweise lesen?", "Nur SYSTEM, die Administratoren und das Dienstkonto (geschützte DACL, src/passkey/geheim.rs, anlegen für Windows).", "Die Datei entsteht mit den Rechten, die die umask vorgibt (am Gerät gemessen: umask 022, also Datei 0644 und Ordner 0755). Das ist zu weit, siehe AN4."],
]

