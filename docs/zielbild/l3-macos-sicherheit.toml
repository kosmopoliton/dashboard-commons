titel = "macOS: die zwei Sicherheitsteile"
reihenfolge = 14
text = """
Dieser Abschnitt gehört zur Studie über den Betrieb unter macOS (Abschnitt „macOS: Studie zur Portierung“). Er behandelt die beiden Stellen, an denen die Portierung den Schutz selbst berührt: die Verschlüsselung der Aufgaben-Links und die erste Anmeldung des Inhabers.

Fassung 2. Sie nimmt eure Prüfung der ersten Fassung auf (neun Punkte im Issue zur Studie) und eure Antworten auf unsere Fragen. Neu ist außerdem ein Block mit dem, was wir am Gerät gemessen haben. Grundlage bleibt der Quelltext am Stand dabe5d1, gelesen und nicht gebaut."""

[[block]]
titel = "Die Grenze, ehrlich gesagt"
text = """
Unter macOS läuft der Server zunächst im Konto des Inhabers, ohne Boten; das habt ihr entschieden. Der lokale Kanal gilt als Hauptkonto. Daraus folgt: Jedes Programm, das im Konto des Inhabers läuft, ist dort der Inhaber. Es kann den Kanal nutzen, einen Einmal-Code holen, die Aufgaben-Links lesen und die Dateien des Servers lesen.

Der Schlüsselbund schützt darum Kopien, Sicherungen und andere Konten am selben Rechner. Er schützt nicht gegen Programme desselben Kontos. Die erste Fassung hat an dieser Stelle zu viel versprochen (macOS frage, bevor ein anderes Programm einen Eintrag liest); unsere Messung am Gerät hat das nicht bestätigt, siehe unten.

Wer mehr will, braucht die Trennung der Konten auch unter macOS: Server unter einem eigenen Systembenutzer, dazu ein Bote im Konto des Inhabers. Das bleibt die spätere, eigene Entscheidung und ist nicht Teil der zwölf Schritte. Dieser Absatz gehört später sinngemäß in die Anleitung."""

[[block]]
titel = "Wovon der Schutz unter Windows lebt"
