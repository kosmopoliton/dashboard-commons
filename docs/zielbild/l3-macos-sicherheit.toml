# --------------------------------------------------------------------------
# Am Gerät gemessen
# --------------------------------------------------------------------------

[[block]]
titel = "Am Gerät gemessen"
text = """
Auf einem Mac mit Apple-Prozessor, macOS 27.2, im Konto eines gewöhnlichen Benutzers. Geprüft mit einem kleinen eigenen Programm, das einen Eintrag der Art „allgemeines Kennwort“ anlegt, liest und löscht und dabei jeden Dialog verbietet (statt einer Nachfrage kommt ein Fehlercode). Alle Einträge und die Signierkennung sind danach wieder entfernt. Die Programme wurden aus einer Shell gestartet, die eine Desktop-Anwendung geöffnet hat; ob das die Ergebnisse zum Anmelde-Schlüsselbund beeinflusst, wissen wir nicht."""

[[block]]
[block.tabelle]
spalten = ["Frage", "Ergebnis"]
zeilen = [
  ["Geht der Data-Protection-Schlüsselbund mit einer lokalen Signatur?", "Nein. Anlegen mit kSecUseDataProtectionKeychain ergibt -34018 (eine nötige Berechtigung fehlt), mit Ad-hoc-Signatur wie mit einer selbst erzeugten Signierkennung. Trägt man die Berechtigung keychain-access-groups selbst ins Programm ein, beendet macOS das Programm beim Start (Signal 9). Dieser Schlüsselbund verlangt ein Bereitstellungsprofil von Apple."],
  ["Lässt sich ein Programm mit einer selbst erzeugten Signierkennung signieren?", "Ja, ohne Administrator. Ein selbst signiertes Zertifikat mit dem Zweck Code-Signatur in einem eigenen Schlüsselbund genügt; codesign nimmt es über seinen Fingerabdruck, auch wenn es als nicht vertrauenswürdig gilt. Die Anforderung des Programms lautet dann: Kennung des Programms und dieses Zertifikat; sie bleibt über einen Neubau gleich."],
  ["Liest ein Neubau desselben Programms den Eintrag ohne Dialog?", "Ja, mit fester lokaler Signatur und auch mit Ad-hoc-Signatur."],
  ["Liest ein fremdes Programm den Eintrag ohne Dialog?", "In unserer Messung ja: Ein anderes, ad hoc signiertes Programm und ein lokal signiertes mit anderer Kennung bekamen den Wert ohne Dialog, obwohl die Zugriffsliste des Eintrags nur das anlegende Programm nennt. Das Systemwerkzeug security dagegen löste den Dialog aus. Warum die selbst gebauten Programme durchkamen, haben wir nicht geklärt. Folge für die Studie: Auf die Zugriffsliste des Anmelde-Schlüsselbunds bauen wir nicht."],
  ["Kann ein fremdes Programm den Eintrag löschen?", "Nein: -25244 (unzulässiger Versuch, den Eigentümer zu ändern). Löschen konnte nur das Programm, das ihn angelegt hat."],
  ["Werden kSecAttrSynchronizable und kSecAttrAccessible im Anmelde-Schlüsselbund gespeichert?", "Nein. Beim Anlegen gesetzt (false und AfterFirstUnlockThisDeviceOnly), beim Lesen fehlen beide Angaben. Der Anmelde-Schlüsselbund ist eine Datei im Benutzerordner und wird nicht über iCloud abgeglichen; er geht aber mit in jede Sicherung des Benutzerordners."],
  ["Lässt sich ein Ordner ohne Administrator von Time Machine ausnehmen?", "Ja: tmutil addexclusion setzt ein Kennzeichen am Ordner, tmutil isexcluded bestätigt es."],
  ["Welche umask gilt?", "022 in der Shell. Für einen Agenten von launchd noch zu messen."],
]

[[block]]
titel = "Was daraus folgt"
punkte = [
  "Der Data-Protection-Schlüsselbund scheidet aus, solange das Programm selbst gebaut und nur lokal signiert ist. Es bleibt der Anmelde-Schlüsselbund.",
  "Einträge im Anmelde-Schlüsselbund sind mit einer Sicherung des Benutzerordners und dem Anmeldekennwort lesbar. Sie sind an kein Gerät gebunden; kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly wirkt dort nicht. Wir setzen die Angaben trotzdem, damit sie gelten, falls das Programm später signiert verteilt wird und in den anderen Schlüsselbund umzieht.",
  "Gegen Programme desselben Kontos schützt der Anmelde-Schlüsselbund nach unserer Messung nicht verlässlich. Das deckt sich mit der Grenze oben.",
  "Die feste lokale Signatur ist machbar und sinnvoll, weil die Anforderung des Programms dann über Neubauten gleich bleibt. Ob sie im Betrieb als Agent Dialoge verhindert, die es sonst gäbe, konnten wir aus der Shell nicht zeigen; das gehört in den Lauf am Gerät in Schritt 4.",
]

# --------------------------------------------------------------------------
# Teil 1
# --------------------------------------------------------------------------

[[block]]
titel = "Teil 1: Die Aufgaben-Links ohne DPAPI"
text = """
Worum es geht: Eine Aufgabe für den Inhaber kann einen einmaligen Link tragen. Er steht verschlüsselt in der Tabelle aufgaben_links (src/speicher/aufgaben.rs, aufgabe_anlegen und link_fuer). Ist die Aufgabe erledigt, abgelaufen oder zurückgezogen, wird der Eintrag gelöscht. Die tägliche Sicherung ist eine Kopie der Datei und bleibt 14 Tage liegen.

Das Schutzziel aus dem Kopf von verschluesselung.rs: Eine kopierte Datei soll niemandem helfen."""

[[block]]
titel = "Der Weg: Mischform"
punkte = [
  "Ein zufälliger Schlüssel von 32 Bytes liegt als Eintrag im Schlüsselbund. Verschlüsselt wird im Programm mit einem verbreiteten Verfahren mit Echtheitsprüfung (XChaCha20-Poly1305 aus RustCrypto), hinter denselben Funktionen verschluesseln und entschluesseln wie heute.",
  "src/speicher/aufgaben.rs und der Weg für Windows bleiben unverändert. Aufgabe und Schlüsseltext stehen weiter in einer Transaktion.",
  "Format eines Eintrags: ein Byte Fassung, 24 Bytes Nonce aus dem Zufall des Systems, dann Schlüsseltext mit Prüfsumme. Zusatzdaten der Echtheitsprüfung: ein fester Text der Anwendung, wie heute der Entropie-Wert; so lässt sich kein Eintrag aus einem anderen Zusammenhang unterschieben.",
  "Der Schlüssel entsteht beim ersten Bedarf und wird einmal je Start aus dem Schlüsselbund gelesen. Im Arbeitsspeicher liegt er in einem Puffer, der beim Freigeben überschrieben wird (zeroize ist schon eine Abhängigkeit).",
  "Fehlt der Schlüssel (anderer Rechner, zurückgespielte Sicherung ohne Schlüsselbund), sind die gespeicherten Links unlesbar und laufen nur ab, wie heute bei DPAPI auf einem anderen PC. Ein neuer Schlüssel entsteht; alte Einträge bleiben unlesbar.",
  "Fehler: nie Klartext und nie der Schlüssel im Protokoll; ein veränderter Eintrag ergibt einen Fehler statt Unsinn. Ist der Schlüsselbund nicht erreichbar, werden Aufgaben mit Link abgelehnt (SpeicherFehler::Verschluesselung), und lesen liefert nichts.",
  "Die Sperre in Zeile 27 entfällt; der Ersatz für Tests (Zeilen 124 bis 135) wird durch den echten Weg mit einem festen Testschlüssel ersetzt, damit auch Tests echt verschlüsseln.",
]

[[block]]
titel = "Was eine Sicherung oder ein Dritter damit anfangen kann"
[block.tabelle]
spalten = ["Wer", "Mischform mit Schlüssel im Anmelde-Schlüsselbund"]
zeilen = [
  ["Sicherungskopie des Datenspeichers allein", "nicht lesbar: der Schlüssel fehlt"],
  ["Sicherung des ganzen Benutzerordners", "lesbar mit dem Anmeldekennwort des Kontos: Der Schlüsselbund liegt verschlüsselt in der Sicherung. Ohne das Kennwort nicht."],
  ["Anderes Konto am selben Mac", "kein Zugriff auf den Schlüsselbund des Inhabers und, mit engen Rechten am Datenordner, keiner auf den Datenspeicher"],
  ["Programm im Konto des Inhabers", "kann lesen; das ist die Grenze. Offene Links bekäme es als Inhaber ohnehin. Neu gegenüber Windows: auch abgelaufene Links aus den Sicherungen der letzten 14 Tage."],
  ["Anderer Mac, zurückgespielte Sicherung", "ohne den Schlüsselbund unlesbar; mit Schlüsselbund und Kennwort lesbar"],
]

[[block]]
titel = "Verworfen, zum Vergleich"
punkte = [
  "Je Link ein eigener Eintrag im Schlüsselbund, ohne Verfahren im Programm (unser Vorschlag der ersten Fassung): hätte src/speicher/aufgaben.rs umgebaut, zwei Schreiber statt einer Transaktion gebracht und den Weg für Windows berührt. Ihr bevorzugt die Mischform; wir folgen dem.",
  "Schlüssel als Datei im Datenordner: läge in jeder Sicherung neben den Daten.",
  "Schlüssel nur im Arbeitsspeicher: nach jedem Neustart wären alle Links weg. Bleibt denkbar als Schalter für später; nicht Teil der Schritte.",
]

[[block]]
titel = "Schlüsselordner und Schlüssel der Ausweise"
punkte = [
  "Befund (AN4): Außerhalb von Windows legt src/passkey/geheim.rs die Datei jwt-schluessel ohne enge Rechte an. Heute ohne Folge, weil das Programm dort nicht baut.",
  "Schritt 3 setzt den Schlüsselordner gleich endgültig um: ein eigener Ordner außerhalb des Datenordners und nie unter .var; Ordner 0700 und Datei 0600 schon beim Anlegen (DirBuilderExt::mode und OpenOptionsExt::mode aus std, also kein Fenster, in dem die Datei offen läge); beim Anlegen von Time Machine ausgenommen; beim Laden Eigentümer und Modus geprüft, ein zu offener Schlüssel wird abgelehnt und nie überschrieben. Test unter cfg(unix).",
  "Vorschlag für den Ort: Library/Application Support/dashboard-schluessel im Benutzerordner, neben dem Datenordner und nicht darin. Ob ihr einen anderen Ort wollt, ist eine Frage an euch.",
  "Schritt 4 nennt den Wechsel: Der Schlüssel der Ausweise zieht in den Schlüsselbund, neben den Schlüssel für die Links. Dabei entsteht ein neuer Schlüssel; alle Ausweise werden einmal ungültig, die Passkeys bleiben. Der Schlüsselordner bleibt als Weg für Unix ohne Schlüsselbund im Code und in den Tests.",
  "Einträge im Schlüsselbund: fester Dienstname der Anwendung, je Zweck ein Kontoname; kSecAttrSynchronizable false und kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly gesetzt (mit der Einschränkung aus der Messung). Der Testserver nimmt einen eigenen Dienstnamen und berührt nie echte Einträge.",
  "Kein Aufruf des Systemwerkzeugs security zum Schreiben: Ein Wert auf der Befehlszeile wäre in der Prozessliste sichtbar. Der Zugriff läuft über das Systemframework.",
]

# --------------------------------------------------------------------------
# Teil 2
# --------------------------------------------------------------------------

[[block]]
titel = "Teil 2: Die erste Anmeldung des Inhabers ohne Windows-Konto"
text = """
Worum es geht: Der erste Passkey entsteht heute immer über die Windows-Anmeldung (konto_noetig in src/api/passkey.rs). Außerhalb von Windows lässt ohne_windows nur einen gültigen Ausweis durch, und der Antrag verlangt ein Konto, das dort nie entsteht.

Entschieden nach euren Antworten: ein lokaler Kanal, an dem der Kern das Konto bezeugt, dazu ein Einmal-Code. Der Kanal gilt als Hauptkonto wie die Windows-Anmeldung. Ein Code darf auch weitere eigene Passkeys anlegen; das ist zugleich der Rückweg bei Verlust. Für die Chats ist der Kanal nur der Transport; ihre Rechte legt ihr mit den Chat-Schlüsseln fest. Andere Konten am selben Mac bekommen zunächst keinen Passkey, und die Oberfläche sagt es. Wege, die heute das Hauptkonto verlangen, nehmen unter macOS eine frische Anmeldung mit Passkey an (höchstens 5 Minuten)."""

[[block]]
titel = "Der lokale Kanal"
punkte = [
  "Ein Unix-Socket in einem Ordner nur für das Konto (Ordner 0700, Socket 0600), nicht im Datenordner. Beim Start prüft der Server: Der Ordner gehört dem eigenen Konto, die Rechte stimmen, kein Glied des Pfads ist eine Verknüpfung; ein alter Socket wird nur entfernt, wenn er dem eigenen Konto gehört.",
  "Je Verbindung fragt der Server den Kern nach dem Konto der Gegenseite (peer_cred an UnixStream von tokio; das Feature net ist schon an, kein unsafe im eigenen Code). Nur das eigene Konto gilt. root wird nicht stillschweigend zugelassen.",
  "Bindung an das Einrichtungskonto: Beim Einrichten wird die uid des Kontos festgehalten, in einem Feld, das Windows nicht liest. Startet das Programm unter einer anderen uid, endet es mit Code 2. So kann nicht ein anderes Konto denselben Datenordner mit eigenem Socket in Betrieb nehmen.",
  "Die Schleusen bleiben: Zeitlimit, Größenbegrenzung und die Liste der Chat-Wege gelten am Socket wie über TCP.",
]

[[block]]
titel = "Der Einmal-Code"
punkte = [
  "Mindestens 128 Bit aus dem Zufall des Systems, als Text zum Einfügen statt zum Tippen.",
  "Der Server hält nur den Hashwert, und nur im Arbeitsspeicher; nichts davon steht im Datenspeicher. Verglichen wird in konstanter Zeit.",
  "Gültig höchstens 15 Minuten und genau einmal. Nach wenigen Fehlversuchen verfällt er (Vorschlag: drei). Es gibt höchstens einen offenen Code; ein neuer ersetzt den alten.",
  "Angenommen wird er nur im JSON-Körper eines POST an http://localhost:<port>, mit derselben Host- und Herkunftsprüfung wie die Passkey-Wege, nur von einer Loopback-Gegenstelle, und nicht, wenn die Anfrage einen Kopf Forwarded, X-Forwarded-* oder Via trägt.",
  "Nie in einer Adresse, nie in einem Cookie, nie im Protokoll.",
  "Jede Ausgabe eines Codes und jeder so angelegte Passkey wird ein Vorgang im Journal mit einer Meldung für den Inhaber.",
  "Ausgegeben wird er nur über den lokalen Kanal, an einen Unterbefehl des Programms, und erst nach dem Beleg im nächsten Block.",
]

[[block]]
titel = "Beleg: Port und Socket gehören zum selben Prozess"
text = """
Vor der Ausgabe eines Codes belegt der Unterbefehl, dass hinter dem TCP-Port derselbe Server steht wie hinter dem Socket. Vorschlag für den Ablauf: Der Unterbefehl schickt über den Socket einen eigenen Zufallswert und bekommt den Port und einen zweiten Zufallswert zurück. Dann ruft er über TCP an localhost einen freien Weg auf und nennt nur den ersten Wert. Der Server antwortet mit einem Prüfwert aus beiden Werten, den nur kennen kann, wer am Socket dabei war. Stimmt der Prüfwert, gehören beide Enden zum selben Prozess. Erst dann fordert der Unterbefehl über den Socket den Code an und zeigt die Adresse, an der er einzufügen ist.

Ein fremder Prozess auf dem Port kann den Prüfwert nicht liefern. Der Unterbefehl bricht dann mit einem Satz ab, der sagt, dass auf dem Port nicht das Dashboard antwortet. Ob ihr einen anderen Beleg bevorzugt, etwa über die Nummer des Prozesses, ist eine Frage an euch."""

[[block]]
titel = "Schnitt im Code: nichts verallgemeinern"
punkte = [
  "Token- und Socket-Weg liegen in eigenen Modulen unter cfg(unix) und cfg(not(windows)). Ein Test unter Windows belegt, dass es den Einrichtungsweg dort nicht gibt (der Weg antwortet wie jeder unbekannte Weg, der Unterbefehl ist unbekannt).",
  "WindowsKonto und das Hauptkonto bleiben im gemeinsamen Code, wie sie sind. Die neue Quelle steht daneben: In ohne_windows (src/sicherheit.rs) setzt sie die vorhandenen Erweiterungen Angemeldet und Inhaber::Hauptkonto, wenn die Anfrage über den lokalen Kanal kam. Der Zweig für Windows wird nicht berührt.",
  "Für den Passkey aus einem Code braucht der Antrag einen Kontonamen, den niemand eintippt. Er kommt aus dem Konto am Kanal. Wie das ohne Änderung an WindowsKonto in die vorhandene Tabelle der Passkeys passt (die Spalte heißt konto_sid), klären wir mit euch, bevor Schritt 7 beginnt.",
  "Je berührter gemeinsamer Datei nennen wir im Angebot den Windows-Test, der das gleiche Verhalten belegt. Für diesen Teil voraussichtlich: src/sicherheit.rs (src/schleusen_test.rs), src/api/passkey.rs (das Testmodul ab Zeile 534), src/api/mod.rs (Liste der Wege, Test der Wegliste in src/oberflaeche.rs).",
]

[[block]]
titel = "Was eine Sicherung oder ein Dritter mit der Anmeldung anfangen kann"
[block.tabelle]
spalten = ["Wer", "Lokaler Kanal", "Einmal-Code", "Passkey und Ausweis (besteht schon)"]
zeilen = [
  ["Anderes Konto am selben Mac", "kommt nicht in den Ordner und nicht an den Socket; käme es an eine Verbindung, lehnt die Prüfung des Kontos ab", "erreicht den Port, kann aber 128 Bit nicht raten; drei Fehlversuche, dann verfallen. Einen nachgemachten Server auf dem Port erkennt der Unterbefehl am Beleg.", "sieht nur die freien Wege; an den Schlüssel der Ausweise kommt es nicht"],
  ["Programm im Konto des Inhabers", "ist der Inhaber", "kann sich selbst einen Code holen; jede Ausgabe steht als Vorgang im Journal und als Meldung", "kann den Schlüssel der Ausweise aus dem Schlüsselbund lesen"],
  ["Sicherungskopie des Datenspeichers", "nichts: kein gespeicherter Zustand", "nichts: Der Hashwert steht nur im Arbeitsspeicher", "nur öffentliche Schlüssel der Passkeys und die Sperrliste"],
  ["Sicherung des ganzen Benutzerordners", "nichts", "nichts", "den Schlüssel der Ausweise nur mit dem Anmeldekennwort (Schlüsselbund); er nützte nur an einem Rechner, an dem der Server damit läuft, und nur von dort"],
  ["Jemand im selben Netz", "nichts", "nichts: nur Loopback, keine weitergereichten Anfragen", "nichts"],
  ["Jemand, der dem Inhaber über die Schulter sieht", "nichts", "könnte den Code lesen; er müsste ihn schneller einfügen und am Gerät des Inhabers den Passkey bestätigen können", "nichts"],
]

[[block]]
titel = "Offen: nur am Gerät zu klären"
punkte = [
  "Cookie des Ausweises: Es heißt __Host-dashboard und trägt Secure, die Seite läuft über http://localhost. Ob Safari es annimmt, ist zu prüfen; ebenso Chrome, Edge und Firefox für macOS.",
  "Passkeys auf http://localhost mit Safari und dem Schlüsselbund von macOS, und ob die Prüfung in src/passkey/webauthn.rs deren Antworten annimmt.",
  "Schlüsselbund im Betrieb als Agent von launchd: Anlegen und Lesen ohne Dialog mit fester lokaler Signatur; Verhalten, solange der Schlüsselbund nach dem Start des Rechners noch gesperrt ist.",
  "umask eines Agenten von launchd; unabhängig davon setzen wir die Rechte beim Anlegen ausdrücklich.",
  "Ob das Kennzeichen zum Ausnehmen von Time Machine eine Rückspielung übersteht.",
  "Die Frage aus der Messung: warum selbst gebaute fremde Programme den Eintrag ohne Dialog lesen konnten. Sie ändert den Vorschlag nicht, gehört aber verstanden.",
]
