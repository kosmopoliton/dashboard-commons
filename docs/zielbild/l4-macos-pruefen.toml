[[block]]
titel = "Vorschlag zu den Skripten"
punkte = [
  "Für den Betrieb unter macOS soll PowerShell nicht nötig sein. Was Chats und Inhaber täglich brauchen (API aufrufen, warten, Schlüssel lesen, Stop-Hook einspielen), wird ein Unterbefehl des Programms: plattformneutral, in Rust geprüft, und unter Windows später ebenso nutzbar. Das beantwortet auch unsere dritte Frage aus dem ersten Issue aus unserer Sicht.",
  "Einrichten, Starten und Entfernen unter macOS werden kleine sh-Skripte neben den PowerShell-Skripten, oder ebenfalls Unterbefehle. Welche Form ihr wollt, ist eine Frage an euch.",
  "Die Skripte für Freigabe und Hochladen bleiben, wie sie sind.",
  "Fassung 2, nach eurer Antwort: Die Unterbefehle gelten unter macOS; unter Windows bleiben vorerst die Skripte.",
]

[[block]]
titel = "Hooks und der Weg für Beiträge vom Mac"
punkte = [
  "commit-msg und pre-push rufen Vor-Push.ps1 über pwsh, sonst powershell.exe (scripts/hooks/commit-msg:11-12). Ohne pwsh scheitert der Hook; wer am Mac mitwirkt, braucht PowerShell 7 oder hängt die Hooks nicht ein.",
  "pre-commit: Zeile 40 nutzt sed -z; das sed von macOS kennt das nicht. Die Prüfung mit Prettier fällt dann vermutlich still aus statt rot zu werden (Schluss, nicht geprüft). Vorschlag: ohne sed, etwa über git diff mit --relative.",
  "pre-commit: Zeile 24-27 verlangt CARGO_TARGET_DIR auf jedem Zweig außer main; der Satz nennt nur den Windows-Ort.",
  "pre-push braucht die privaten Namenslisten und lässt nur main und Tags zu. Er ist ein Werkzeug der Betreuer; im Fork lässt er sich nicht sinnvoll einhängen.",
  "Am Mac prüfbar vor einem Angebot: Meldung (mit pwsh), Format, nach der Portierung clippy und Tests. Nicht prüfbar: der volle Prüfer.",
  "Fassung 2, geklärt: Autor und Committer mit der noreply-Adresse unseres Kontos, keine Signatur, keine Commits oder Merges über die Oberfläche der Plattform. Euer Prüfer lernt fremde Autoren, bevor ihr das erste Mal übernehmt.",
]

[[block]]
titel = "Lücke im Prüfer: Heimatpfade von macOS"
text = """
Die Muster für Benutzerpfade in Vor-Push.ps1 erkennen Laufwerk, /c/Users, /mnt/c, kodierte Formen und kurze Namen, aber keinen Pfad der Form /Users/<name> oder /home/<name>. Wer am Mac mitwirkt, könnte seinen Heimatpfad einchecken, ohne dass der Prüfer es merkt; nur die private Namensliste finge den Namen. Vorschlag: ein Muster mehr, dazu ein Gegentest nach Art von benutzerpfade_in_allen_schreibformen (tests/vor_push.rs:399). Bis dahin suchen wir selbst vor jedem Angebot in der ganzen Geschichte des Zweigs nach /Users/ und nach dem eigenen Kontonamen. Fassung 2: Ihr habt angekündigt, dass der Prüfer Heimatpfade von macOS und Linux lernt."""

