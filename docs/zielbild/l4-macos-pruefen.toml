titel = "macOS: prüfen, auch ohne Mac"
reihenfolge = 14
text = """
Dieser Abschnitt gehört zur Studie über den Betrieb unter macOS (Abschnitt „macOS: Studie zur Portierung“). Er beantwortet die Frage, wie sich jeder Schritt prüfen lässt, auch von jemandem, der nur Windows hat. Dazu listet er, was an Skripten, Tests, Browser-Proben, Werkzeugen der Oberfläche und in der Anleitung an Windows hängt.

Fassung 2: Der Nachweis je Schritt folgt jetzt eurer Festlegung (Block „Fassung 2: der Nachweis“). Grundlage: der Stand dabe5d1 (Fassung 0.3.0), gelesen und nicht ausgeführt. Was nur aus Kenntnis von macOS oder PowerShell folgt und nicht aus dem Repo, ist als Schluss gekennzeichnet."""

[[block]]
titel = "Drei Befunde vorab"
punkte = [
  "Heute lässt sich außerhalb von Windows nichts übersetzen außer den Tests der Bibliothek (Sperre in src/speicher/verschluesselung.rs:27). Auch die Integrationstests in tests/ binden die Bibliothek ohne den Ersatz für Tests und übersetzen darum nicht. Der erste Schritt der Portierung macht cargo check für das Apple-Ziel überhaupt erst möglich; ab dann ist dieser Befehl der Prüfpunkt jeder Etappe.",
  "Werkzeuge sucht das Programm nur an festen Orten, außerhalb von Windows nur /usr/bin/git (src/dienst/programme.rs:95-100). Jeder Test, der PowerShell oder Node braucht, überspringt sich darum unter macOS; mit DASHBOARD_TESTS_VOLL bricht er ab. Ein voller grüner Lauf ist unter macOS erst möglich, wenn die Liste macOS-Orte kennt.",
  "Im Repo gibt es keine automatische Prüfung auf einem fremden Rechner (kein Ordner .github). Fertig heißt: cargo test und npm run verify grün, Anleitung aktuell, Ja des Prüfers (docs/zielbild/f-etappenplan.toml).",
]

# --------------------------------------------------------------------------

[[block]]
titel = "Fünf Wege zu prüfen, und was jeder beweist"
[block.tabelle]
spalten = ["Weg", "Wer kann ihn gehen", "Beweist", "Beweist nicht"]
zeilen = [
  ["1: Typprüfung für das Apple-Ziel von Windows aus (rustup target add aarch64-apple-darwin x86_64-apple-darwin; cargo check --workspace --all-targets --target aarch64-apple-darwin; ebenso clippy)", "die Betreuer selbst, auf ihrem Windows-Rechner", "Alle Zweige für macOS sind typrichtig und ohne Warnung; keine Windows-Schnittstelle steht ohne Sperre da. Braucht nach Durchsicht von Cargo.lock keinen Linker und kein Apple-SDK: Die Abhängigkeiten sind reines Rust, Systemframeworks werden nur über link-Angaben gebunden. Nicht ausgeführt, also als erster Schritt zu bestätigen.", "dass es linkt, startet und sich richtig verhält; Rechte, launchd, Schlüsselbund"],
  ["2: Entscheidungen in plattformneutrale Funktionen legen, dünne Zweige je Plattform; Tests laufen unter Windows", "die Betreuer selbst", "Die Regeln stimmen: Pfadmodell, Liste der Werkzeug-Orte, Schwärzen von Pfaden, Regeln für Code und Konto, Text der launchd-Datei, Lesen aufgezeichneter Ausgaben von Systemwerkzeugen. Jede Gegenprobe ist unter Windows nachvollziehbar.", "dass die echten Befehle am Mac die aufgezeichnete Form liefern und der dünne Zweig richtig aufruft. Dieser Rest muss so klein bleiben, dass man ihn in der Durchsicht ganz liest."],
  ["3: Lauf auf einem fremden macOS-Rechner zum genannten Commit (ein gemieteter Läufer, vom Fork aus gestartet)", "wir; die Betreuer lesen das Protokoll", "Der Commit baut, linkt und besteht cargo test und npm run verify auf einem frischen macOS, unabhängig von unserem Rechner", "Einrichtung mit launchd, Schlüsselbund mit Nachfrage, Passkey mit echtem Gerät, Verhalten nach Neustart. Die Betreuer müssen dem Protokoll trauen; prüfbar ist die Commit-Kennung darin."],
  ["4: Schriftliches Prüfprotokoll vom Mac: je Etappe eine feste Liste aus Befehl, erwarteter und tatsächlicher Ausgabe", "wir", "was nur ein echter Mac zeigen kann", "Unabhängigkeit: Es ist eine Selbstauskunft. Am stärksten zusammen mit Weg 1 und 3 zum selben Commit."],
  ["5: Linux als Zwischenstufe: Alles unter cfg(unix) oder cfg(not(windows)) läuft auch dort (auch im Linux-Teil von Windows)", "die Betreuer selbst", "Signale, Prozessgruppen, Dateirechte, Unix-Socket mit Konto der Gegenseite, Besitzer von Ordnern", "alles, was nur macOS hat: Schlüsselbund, launchd, open, die Werkzeuge des Systems"],
]

[[block]]
titel = "Fassung 2: der Nachweis, wie ihr ihn festgelegt habt"
punkte = [
  "Je Schritt prüft ihr selbst: den Diff vor jedem Bau, den vollen Prüfweg unter Windows mit Vergleich der Testnamen und die Übersetzung für den Mac (Weg 1). Das sind die Wege 1 und 2 der Tabelle.",
  "Als Beleg vom Mac zählt ein Lauf auf einem macOS-Runner der Plattform in unserem Fork, mit der Workflow-Datei, die ihr uns gebt: nur von Hand gestartet, der Commit als Eingabe. Ihr prüft den Lauf am Commit und die Datei per Hash. Das ersetzt Weg 3 in unserer ersten Form (eine eigene Datei von uns).",
  "Die Workflow-Datei liegt nur im Fork und wird nie angeboten; im Basis-Repo erlaubt die Positivliste des Prüfers den Ordner dafür nicht (scripts/Vor-Push.ps1:664-677).",
  "Ein Protokoll vom Gerät (Weg 4) ist willkommen, aber kein Beleg. Wir hängen es an, wo nur ein echtes Gerät etwas zeigen kann: Einrichtung mit launchd, Schlüsselbund im Betrieb, Passkey im Browser, Neustart.",
  "Läufe unter Linux gibt es auf eurer Seite nicht. Weg 5 bleibt darum nur unsere eigene Vorprüfung; die Zweige unter cfg(unix) belegt der Runner.",
  "Im Issue nennen wir je Schritt: Zweig, Commit, die Nummer des Laufs und die berührten gemeinsamen Dateien mit ihrem Windows-Test (die vorläufige Liste steht im Überblick).",
]

[[block]]
titel = "Inhalt eines Protokolls vom Gerät"
punkte = [
  "Fassung von macOS, Rust und Node.",
  "cargo fmt --all --check; cargo clippy --workspace --all-targets --locked -- -D warnings.",
  "cargo test, und noch einmal mit DASHBOARD_TESTS_VOLL=1 und --nocapture. Dann ist belegt, dass nichts übersprungen wurde; im normalen Lauf die Zeilen ÜBERSPRUNGEN zählen und nennen.",
  "Nach cargo test muss git status in web/src/lib/vertrag leer sein: Die erzeugten Typen dürfen sich unter macOS nicht unterscheiden (Zeilenenden, Reihenfolge).",
  "In web: npm ci und npm run verify. Die Kennung des Grundbaus (web/scripts/grundbau.mjs) muss bei gleichem web/src denselben Wert ergeben wie unter Windows.",
  "dashboard pruefe --system für docs/anleitung und docs/zielbild: 0 Fehler, 0 Hinweise.",
  "Start mit --konsole, Abruf von /healthz und /api/betrieb.",
  "Für die Etappe mit launchd: Zustand des Agenten und ein Neustart des Rechners.",
  "Die Browser-Proben mit dem Browser von macOS.",
  "Alle Ausgaben als Text, vor dem Anhängen geschwärzt (Heimatpfad, Rechnername, Kontoname). Keine Bildschirmfotos mit Pfaden.",
]

[[block]]
titel = "Hausstil neuer Tests"
punkte = [
  "Gegentests mit Gegenprobe, wie im Repo üblich: Jeder Fall baut einen Wegwerf-Aufbau im Temp-Ordner, der saubere Fall ist grün, jeder veränderte rot; im selben Test steht die Gegenprobe mit einer Behauptung, die ohne die Änderung kippt.",
  "Namen als deutsche Aussagesätze in Kleinschrift mit Unterstrich, ohne Umlaute; Kommentar mit Herkunft.",
  "Werkzeuge nur über dashboard::dienst::programme; fehlt eines: dashboard::ueberspringen und return (src/lib.rs:79-85). Mit DASHBOARD_TESTS_VOLL wird nichts übersprungen.",
  "Erfundene Namen und Adressen, Beispielbenutzer ranke. Nie echte Orte: nie Port 8787, nie der echte Socket, nie der echte Schlüsselbund-Eintrag. Tests am Mac nehmen einen eigenen Temp-Ordner, einen eigenen Socket-Namen, einen eigenen Dienstnamen im Schlüsselbund und ein eigenes Kennzeichen für launchd.",
  "Aufgezeichnete Ausgaben von Systemwerkzeugen unter tests/beispiel (der Ort liegt in der Positivliste). Sie enthalten Rechnernamen, Kontonamen, Seriennummern und Pfade und werden vor dem Einchecken von Hand geschwärzt.",
]

