  "Welche der 92 Tests mit Windows-Formen unter macOS tatsächlich scheitern; sicher gelesen ist nur tests/zusammenbau.rs:667.",
  "Ob npm ci und npm run verify unter macOS grün sind.",
  "Ob die Browser-Proben mit einem Browser von macOS ohne weitere Änderung laufen, sobald Pfad, Prozessende und Anmeldung gelöst sind.",
  "Der Inhalt der privaten Namenslisten; damit auch, ob neue Begriffe für macOS beim Prüfer anschlagen.",
  "Die Komponenten der Oberfläche und ihre Tests sind nicht auf Windows-Texte durchgesehen; das steht noch aus.",
  "Die Zählung der Tests ist statisch; Tests aus Schleifen über Fälle sind nicht einzeln gezählt.",
]
